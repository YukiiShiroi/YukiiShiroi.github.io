}
async function gh(path, opts = {}){
  let res;
  try{
    res = await fetch('https://api.github.com' + path, {...opts, cache:'no-store', headers:{
      Accept:'application/vnd.github+json', Authorization:`Bearer ${SY.token}`, 'X-GitHub-Api-Version':'2022-11-28',
      ...(opts.body ? {'Content-Type':'application/json'} : {})}});
  }catch{ const e = new Error('Offline — will sync when you’re back online.'); e.offline = true; throw e; }
  if (!res.ok){
    const e = new Error(
      res.status === 401 ? 'GitHub didn’t accept the token. It may have expired or been revoked — disconnect and connect with a new one.'
      : res.status === 403 || res.status === 429 ? 'GitHub is limiting requests right now. It’ll try again shortly.'
      : res.status === 404 ? 'The sync file is missing (it may have been deleted on GitHub). Disconnect and connect again to create a new one.'
      : `GitHub returned an error (${res.status}).`);
    e.status = res.status;
    throw e;
  }
  return res.status === 204 ? null : res.json();
}

/* Merge the sync file into this device. Cards: the most recently studied copy wins.
   Memory aids and learning settings: the most recent edit wins. Guides: done anywhere = done.
   Study logs: each device keeps its own, so other devices' logs go to DB.peers. */
function mergeRemote(R){
  R = cleanDB(R);
  if (!R || !R.cards) return;
  if ((DB.resetAt || 0) > (R.resetAt || 0)){ DB.peers = {}; return; }    // this device reset everything: it wins
  if ((R.resetAt || 0) > (DB.resetAt || 0)){                              // another device reset everything
    const keep = DB.settings, vocab = DB.vocab;                           // your word list is content, not progress: keep it
    DB = merge(defaults(), {resetAt:R.resetAt});
    DB.settings = keep; DB.vocab = vocab;
  }
  // Vocabulary words: the most recent edit wins (deletions are kept as markers so they spread too)
  for (const [id, b] of Object.entries(R.vocab || {})){
    const a = DB.vocab[id];
    if (!a || (b.at || 0) > (a.at || 0)) DB.vocab[id] = b;
  }
  // Retention checks: when each item was learned (earliest) and every result recorded on any device
  for (const [id, b] of Object.entries(R.ret || {})){
    const a = DB.ret[id];
    DB.ret[id] = a ? {l:Math.min(a.l, b.l), c:{...b.c, ...a.c}} : b;
  }
  for (const [id, b] of Object.entries(R.cards)){
    const a = DB.cards[id];
    if (!a || (b.u || 0) > (a.u || 0) || ((b.u || 0) === (a.u || 0) && (b.reps || 0) > (a.reps || 0))) DB.cards[id] = b;
  }
  const mnIds = new Set([...Object.keys(R.mnT || {}), ...Object.keys(R.mn || {})]);
  for (const id of mnIds){

  if (a === 'chart'){ chartScript = el.dataset.s; render(); }
  if (a === 'detail') openDetail(el.dataset.id);
  if (a === 'drill'){ S = null; window.scrollTo(0, 0); startDrill(); }
  if (a === 'drill-pick') drillPick(el.dataset.id);
  if (a === 'drill-next'){ D.i++; D.picked = null; render(); toast('Noted — this pair will come up again in your drills'); }
  if (a === 'cold') openCold(el.dataset.s);
  if (a === 'cl-script'){ clScript = el.dataset.s; render(); }
  if (a === 'cl-set'){ clAll = el.dataset.all === '1'; render(); }
  if (a === 'cl-start') startCold();
  if (a === 'cl-quit') clQuit();
  // Tapping the button would take the focus (and a phone's keyboard) away from the answer box: give it straight back
  if (a === 'cl-skip'){ clSubmit('', true); document.getElementById('cltyped')?.focus(); }
  if (a === 'cl-typo') clTypo(+el.dataset.i, el.dataset.kind);
  if (a === 'cl-relearn' && CL){ const ids = [...new Set(CL.res.filter(r => !clOk(r)).map(r => r.id))]; CL = null; startLesson({ids}); }
  if (a === 'guide'){ G = {id:el.dataset.id, q:-1, score:0, picked:null}; render(); window.scrollTo(0, 0); }
  if (a === 'guide-back'){ G = null; render(); window.scrollTo(0, 0); }
  if (a === 'guide-quiz'){ Object.assign(G, {q:0, score:0, picked:null}); prepGuideQ(); render(); }
  if (a === 'guide-pick') guidePick(el.dataset.val);
  if (a === 'guide-next'){ G.q++; G.picked = null; prepGuideQ(); render(); }
  if (a === 'mn-edit' || a === 'mn-cancel' || a === 'mn-save' || a === 'mn-clear'){
    e.stopPropagation();
    const id = el.dataset.id, box = el.closest('[data-mnbox]');
    if (a === 'mn-save'){
      const v = box.querySelector('textarea').value.trim();
      if (v) DB.mn[id] = v; else delete DB.mn[id];
      DB.mnT[id] = Date.now();
      save();
    }
    if (a === 'mn-clear'){ delete DB.mn[id]; DB.mnT[id] = Date.now(); save(); }
    box.outerHTML = mnBoxHTML(id, a === 'mn-edit');
    if (a === 'mn-edit') document.querySelector(`[data-mninput="${CSS.escape(id)}"]`)?.focus();
  }
  if (a === 'theme'){
    const order = THEMES.map(t => t[0]);
    DB.settings.theme = order[(order.indexOf(DB.settings.theme) + 1) % order.length];
    save(); applyTheme(); if (view === 'settings') render();
    toast(`Theme: ${themeName(DB.settings.theme)}`);
  }
  if (a === 'set'){
    DB.settings[el.dataset.key] = el.dataset.val;
    if (SYNC_SETTINGS.includes(el.dataset.key)) DB.settingsT = Date.now();
    save();
    if (el.dataset.key === 'theme' || el.dataset.key === 'font') applyTheme();
    render();
  }
  if (a === 'install' && installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); }
  if (a === 'code-copy'){
    makeCode().then(async code => {
      document.getElementById('codeArea').innerHTML = `<textarea class="codebox" readonly>${code}</textarea>`;
      const ta = document.querySelector('#codeArea textarea'); ta.select();
      try{ await navigator.clipboard.writeText(code); toast('Transfer code copied'); }
      catch{ toast('Select the code above and copy it'); }
    });
  }
  if (a === 'code-paste'){
    document.getElementById('codeArea').innerHTML = `<textarea class="codebox" placeholder="Paste your KANA1… code here"></textarea><div class="btns" style="margin-top:10px"><button class="btn primary" data-act="code-load">Load progress</button></div>`;
    document.querySelector('#codeArea textarea').focus();
  }
  if (a === 'code-load'){
    const code = document.querySelector('#codeArea textarea').value;
    readCode(code).then(d => {
      if (!confirm('Replace the progress on this device with the pasted code?')) return;
      DB = merge(defaults(), cleanDB(d)); rebuildVocab(); save(); applyTheme(); toast('Progress loaded'); render();
    }).catch(() => toast('That doesn’t look like a valid transfer code'));
  }
  if (a === 'export' && NATIVE){
    nativeShareFile(`kanamichi-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(DB, null, 1)).catch(e => { if (!/cancel/i.test(e?.message || '')) toast('Couldn’t share the backup'); });
  }
  else if (a === 'export'){
    const blob = new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = `kanamichi-backup-${new Date().toISOString().slice(0,10)}.json`;
    link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  if (a === 'import') document.getElementById('importFile').click();
  if (a === 'reset' && confirm(syncConnected() ? 'Reset ALL progress on every synced device? This cannot be undone.' : 'Reset ALL progress? This cannot be undone.')){
    const keep = DB.settings, vocab = DB.vocab; DB = defaults(); DB.settings = keep; DB.vocab = vocab; DB.resetAt = Date.now(); rebuildVocab(); save(); toast('Progress reset'); render();
  }
});
function prepGuideQ(){
  const g = GUIDES.find(x => x.id === G.id);
  if (G.q < g.quiz.length) G.order = shuffle(g.quiz[G.q].slice(1));
}
function guidePick(val){
  if (!G || G.picked !== null) return;
  const g = GUIDES.find(x => x.id === G.id), [prompt, right] = g.quiz[G.q];
  G.picked = val;
  if (val === right) G.score++;
  speak(prompt.replace(/ /g, ''));
  if (G.q === g.quiz.length - 1 && G.score >= g.quiz.length - 1){ DB.guides[g.id] = true; save(); autoVocab(); }
  render();
}
document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'type'){ e.preventDefault(); submitTyped(); }
  if (e.target.dataset.form === 'sync'){ e.preventDefault(); syncConnect(document.getElementById('syncToken')?.value); }
  if (e.target.dataset.form === 'ret'){ e.preventDefault(); retSubmit(document.getElementById('rtyped')?.value || ''); }
  if (e.target.dataset.form === 'cold'){ e.preventDefault(); clSubmit(document.getElementById('cltyped')?.value || ''); }
  if (e.target.dataset.form === 'vocab-add'){ e.preventDefault(); vocabAddFromForm(); }
  if (e.target.dataset.form === 'vocab-edit'){ e.preventDefault(); vocabSaveEdit(e.target); }
  if (e.target.dataset.form === 'gram'){ e.preventDefault(); gramAnswer(document.getElementById('gtyped')?.value || ''); }
  if (e.target.dataset.form === 'lesson'){
    e.preventDefault();
    lessonAnswer(document.getElementById('ltyped')?.value || '');
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.set) document.querySelector(`[data-out="${t.dataset.set}"]`)?.replaceChildren(t.value);
  if (t.id === 'vjp' || t.id === 'vkata'){
    if (t.id === 'vkata') vocabKata = t.checked;
    const raw = document.getElementById('vjp')?.value || '', kana = toKanaInput(raw, document.getElementById('vkata')?.checked);
    const prev = document.getElementById('vjpPrev'); if (prev) prev.textContent = /[a-z]/i.test(raw) ? kana : '';
  }
  if (t.id === 'vbulk' || t.id === 'vbulkKata'){ const n = parseVocab(document.getElementById('vbulk').value, document.getElementById('vbulkKata').checked).length; document.getElementById('vbulkCount').textContent = n ? `${n} word${n > 1 ? 's' : ''} found` : ''; }
  if (t.id === 'vq'){ vocabQuery = t.value; vocabShown = 24; document.getElementById('vlist').innerHTML = vocabListHTML(); }
  if (t.id === 'typed' && S && S.firstKey == null) S.firstKey = performance.now();
  if (t.id === 'cltyped' && CL && CL.firstKey == null && t.value) CL.firstKey = performance.now();
  // Phone keyboards don't always send a Space keydown, and pasted text can hold several words:
  // spread the words across the following boxes and move on
  if (t.classList.contains('cb-in') && cbListening() && /^\s+$/.test(t.value)){ t.value = ''; cbPlayBox(+t.dataset.l, +t.dataset.t); }
  else if (t.classList.contains('cb-in') && !t.classList.contains('en') && /\s/.test(t.value)){
    const ins = [...document.querySelectorAll('.cb-in')], i = ins.indexOf(t);
    const parts = t.value.split(/\s+/), trailing = parts[parts.length - 1] === '';
    const words = parts.filter(Boolean);
    t.value = words[0] || '';
    let j = i;
    for (const w of words.slice(1)){ if (j + 1 >= ins.length) break; ins[++j].value = w; }
    const next = trailing || words.length > 1 ? j + 1 : j;
    ins[Math.min(next, ins.length - 1)].focus();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.lesson){ DB.settings.lessons[t.dataset.lesson] = t.checked; DB.settingsT = Date.now(); if (P && !P.checked) P = null; save(); render(); }
  if (['newPerDay', 'newWords', 'newVocab', 'newKanji', 'newKwords', 'lessonSize'].includes(t.dataset.set)){ DB.settings[t.dataset.set] = +t.value; DB.settingsT = Date.now(); save(); const est = document.getElementById('loadEst'); if (est) est.innerHTML = loadEstimate(); }
  if (t.dataset.set === 'sound' || t.dataset.set === 'autoplay'){ DB.settings[t.dataset.set] = t.checked; save(true); if (t.dataset.set === 'sound' && !t.checked && player){ queued = null; } render(); }
  if (t.dataset.set === 'autoVocab'){ DB.settings.autoVocab = t.checked; DB.settingsT = Date.now(); save(); if (t.checked) { const n = autoVocab(); if (n) toast(`${n} vocab word${n === 1 ? '' : 's'} unlocked`); } }
  if (t.id === 'importFile' && t.files[0]){
    t.files[0].text().then(txt => {
      const d = cleanDB(JSON.parse(txt));
      if (!d || !isObj(d.cards)) throw new Error('bad');
      t.value = '';
      if (!confirm('Replace the progress on this device with this backup? Anything you’ve studied here since the backup was made will be lost.')) return;
      DB = merge(defaults(), d); rebuildVocab(); save(); applyTheme(); toast('Backup imported'); render();
    }).catch(() => { t.value = ''; toast('That file isn’t a Kanamichi backup'); });
  }
});
document.addEventListener('focusin', e => { if (e.target.classList?.contains('cb-in') && cbListening()) cbPlayBox(+e.target.dataset.l, +e.target.dataset.t); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (modalId){ if (e.key === 'Escape') closeModal(); else if (e.key === 'Tab') trapTab(e); return; }
  if (view === 'cold' && CL && CL.phase === 'test' && e.key === 'Escape'){ clQuit(); return; }
  if (e.target.classList?.contains('cb-in')){
    const ins = [...document.querySelectorAll('.cb-in')], i = ins.indexOf(e.target);
    if (e.key === ' ' && cbListening() && !e.target.value.trim()){ e.preventDefault(); cbPlayBox(+e.target.dataset.l, +e.target.dataset.t); return; }
    if ((e.key === ' ' && !(e.shiftKey && e.target.classList.contains('en'))) || e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey && i < ins.length - 1)){
      e.preventDefault();
      if (i < ins.length - 1) ins[i + 1].focus();
      else if (e.key === 'Enter') checkPage();
    }
    if (e.key === 'Backspace' && !e.target.value && i > 0){ e.preventDefault(); ins[i - 1].focus(); }
    return;
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (view === 'grammar' && GQ && GQ.phase === 'quiz'){
    const cur = GQ.qs[GQ.i];
    if (e.key === 'Escape') document.querySelector('[data-act="gram-quit"]')?.click();
    else if (GQ.answered && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); gramNextQ(); }
    else if (!GQ.answered && cur.q.t === 'pick' && /^[1-4]$/.test(e.key)){ const o = cur.opts[+e.key - 1]; if (o) gramAnswer(o); }
    else if (!GQ.answered && cur.q.t === 'order' && e.key === 'Enter' && cur.chosen.length === cur.tiles.length){ e.preventDefault(); gramAnswer(); }
    return;
  }
  if (view === 'flash' && FC){
    if (e.key === 'Escape') document.querySelector('[data-act="fc-quit"]')?.click();
    else if (!FC.flipped && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); fcFlip(); }
    else if (FC.flipped && (e.key === '1' || e.key === 'ArrowLeft')) fcMark(false);
    else if (FC.flipped && (e.key === '2' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); fcMark(true); }
    return;
  }
  if (view === 'read' && RD && RD.phase === 'quiz'){
    const q = RD.qs[RD.qi];
    if (q.pick === null && /^[1-4]$/.test(e.key)){ const o = q.opts[+e.key - 1]; if (o) document.querySelector(`[data-act="read-pick"][data-val="${CSS.escape(o)}"]`)?.click(); }
    else if (q.pick !== null && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); document.querySelector('[data-act="read-next"]')?.click(); }
    return;
  }
  if (view === 'retention' && RQ && RQ.i < RQ.qs.length){
    const typed = DB.settings.mode === 'type';
    if (!RQ.revealed){ if (!typed && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); retReveal(); } return; }
    if (typed && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); document.querySelector('[data-act="ret-next"]')?.click(); }
    if (typed && e.key.toLowerCase() === 't' && RQ.typed && !RQ.typed.ok && canForgive(CARDS[RQ.qs[RQ.i].id], RQ.typed)){ RQ.typed.kind = RQ.typed.kind === 'typo' ? 'know' : 'typo'; render(); }
    if (!typed && (e.key === '1' || e.key === '2')) retRecord(e.key === '2');
    return;
  }
  if (view === 'lesson' && L){
    if (e.key === 'Escape') return lessonQuit();
    if (L.phase === 'teach'){
      if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); lessonMove(1); }
      if (e.key === 'ArrowLeft') lessonMove(-1);
      if (e.key.toLowerCase() === 'r') speakSlide();
    } else if (L.phase === 'quiz'){
      if (L.picked === null && DB.settings.mode !== 'type' && /^[1-4]$/.test(e.key) && L.opts[+e.key - 1]) lessonAnswer(null, L.opts[+e.key - 1]);
      else if (L.picked !== null && !L.ok && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); nextLessonQ(); }
      else if (L.picked !== null && !L.ok && e.key.toLowerCase() === 't') lessonTypo();
      if (e.key.toLowerCase() === 'r') speak(CARDS[L.cur].kana);
    }
    return;
  }
  if (view === 'drill' && D && D.i < D.qs.length){
    const q = D.qs[D.i];
    if (D.picked === null && /^[1-4]$/.test(e.key) && q.opts[+e.key - 1]) drillPick(q.opts[+e.key - 1]);
    else if (D.picked !== null && D.picked !== q.target && e.key.toLowerCase() === 't') drillTypo();
    else if (D.picked !== null && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); document.querySelector('[data-act="drill-next"]')?.click(); }
    if (e.key === 'Escape'){ D = null; view = 'home'; render(); }
    return;
  }
  if (view !== 'study' || !S) return;
  if (e.key === 'Escape') return quit();
  if (e.key.toLowerCase() === 'r'){ const c = CARDS[S.cur]; speak(c.kind === 'kword' ? c.reading : c.kana); return; }
  if (e.key.toLowerCase() === 't' && S.revealed && S.typed && !S.typed.ok){ setReviewMistake(S.typed.kind === 'typo' ? 'know' : 'typo'); return; }
  if (!S.revealed){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (DB.settings.mode === 'type') submitTyped(); else reveal(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); answer(suggested()); }
  if (/^[1-4]$/.test(e.key)){ e.preventDefault(); answer(+e.key); }
});

if (!SELFTEST && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

applyTheme();
detectCopies();
autoVocab();
render();
nativeRestore();
syncReady = true;
updateSyncUI();
if (syncConnected()) syncNow();
if (loadProblem) setTimeout(() => toast('Your saved progress couldn’t be read, so a copy was kept aside. Connect sync or import a backup to bring it back.'), 600);
</script>
</body>
