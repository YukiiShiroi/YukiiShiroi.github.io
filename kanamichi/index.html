.xcmp{width:100%; border-collapse:collapse; font-size:13px}
.xcmp th{font-size:11px; color:var(--muted); text-align:left; font-weight:700; padding:4px 6px}
.xcmp td{padding:7px 6px; border-top:1px solid var(--line)}
@media (max-width:640px){ .ret-banner{flex-wrap:wrap} .ret-banner .btn{width:100%} .ret-tiles{grid-template-columns:1fr} }

/* Vocabulary */
.vkanji{font-family:'Shippori Mincho',serif; font-size:22px; color:var(--ink-2); margin-top:4px; text-align:center}
.vmean{font-size:30px; font-weight:700; line-height:1.2; margin:8px 0 2px; text-align:center}
.opts.words .opt{font-size:19px; letter-spacing:0; padding:16px 10px 10px}
.vstats{display:flex; flex-wrap:wrap; gap:6px 18px; margin:-6px 0 18px; color:var(--ink-2); font-size:14px}
.vstats b{font-size:18px; color:var(--ink)}
.vgrid{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.vadd{display:flex; flex-direction:column; gap:12px}
.vadd label, .vitem.editing{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700}
.vadd input:not([type=checkbox]), .vitem input, .vsearch, .vbulk textarea{font:inherit; font-size:16px; font-weight:400; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--ink); width:100%; min-width:0}
.vadd input:focus, .vitem input:focus, .vsearch:focus, .vbulk textarea:focus{outline:none; border-color:var(--ai); box-shadow:0 0 0 3px color-mix(in srgb,var(--ai) 18%,transparent)}
.vjpwrap{display:flex; align-items:center; gap:10px}
.vprev{font-size:24px; white-space:nowrap; color:var(--shu)}
.vadd .vcheck, .vcheck{flex-direction:row; align-items:center; gap:6px; font-weight:500; font-size:13px; color:var(--ink-2)}
.vadd details summary, .vbulk summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--ai)}
.vadd details label{margin-top:8px}
.vpacks{display:flex; flex-direction:column; gap:10px}
.vpack{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--paper)}
.vpack.vauto{border-color:color-mix(in srgb,var(--matcha) 45%,transparent); background:color-mix(in srgb,var(--matcha) 7%,var(--paper))}
.vpack .kana{font-size:16px; color:var(--ink)}
.unlock-note{font-weight:700; color:var(--matcha); margin:-14px 0 14px}
.vbulk{margin-top:14px}
.vbulk textarea{resize:vertical; font-family:'Atkinson Hyperlegible',var(--ui-font)}
.vsearch{max-width:280px}
.vlist{display:flex; flex-direction:column}
.vitem{display:grid; grid-template-columns:minmax(90px,auto) 1fr auto auto; gap:12px; align-items:center; padding:10px 2px; border-top:1px solid var(--line)}
.vitem:first-child{border-top:0}
.vjp{background:none; border:0; padding:0; text-align:left; display:flex; flex-direction:column; color:var(--ink)}
.vjp .kana{font-size:24px; line-height:1.15}
.vjp small{font-family:'Shippori Mincho',serif; color:var(--muted); font-size:13px}
.vtxt{display:flex; flex-direction:column; min-width:0}
.vtxt b{font-size:15px}
.vtxt span{font-size:12px; font-family:'Atkinson Hyperlegible',sans-serif}
.vact{display:flex; gap:4px; align-items:center}
.vact .icon-btn{width:30px; height:30px; font-size:13px}
.vitem.editing{grid-template-columns:repeat(4,1fr); font-weight:400}
.vitem.editing .btns{grid-column:1/-1; justify-content:flex-end}
@media (max-width:760px){
  .vgrid{grid-template-columns:1fr}
  .vitem{grid-template-columns:auto 1fr auto}
  .vitem .chip{display:none}
  .vitem.editing{grid-template-columns:1fr 1fr}
  .vsearch{max-width:none}
}

/* Sync */
#syncBtn[hidden]{display:none}
#setBtn{display:none}
@media (max-width:640px){ #setBtn{display:grid} #setBtn svg{width:18px; height:18px} }
#syncBtn .tick{opacity:0}
#syncBtn.sync-ok .tick{opacity:1; stroke:var(--matcha)}
#syncBtn.sync-syncing svg{animation:pulse 1s ease-in-out infinite}
#syncBtn.sync-error{color:var(--shu); border-color:color-mix(in srgb,var(--shu) 45%,transparent)}
#syncBtn.sync-offline{opacity:.55}
@keyframes pulse{50%{opacity:.35}}
.sync-row{display:flex; gap:10px; align-items:flex-start}
.sync-dot{width:10px; height:10px; border-radius:50%; margin-top:6px; flex:none; background:var(--matcha)}
.sync-dot.syncing{background:var(--gold); animation:pulse 1s infinite}
.sync-dot.error{background:var(--shu)}
.sync-dot.offline{background:var(--muted)}
.sync-err{color:var(--shu); font-size:13px; margin:6px 0 0}
.sync-devs{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.sync-dev{font-size:12px; padding:4px 10px; border-radius:999px; background:var(--paper); border:1px solid var(--line); color:var(--ink-2)}
.sync-dev.me{border-color:color-mix(in srgb,var(--matcha) 50%,transparent); color:var(--matcha); font-weight:700}
.sync-manual{margin-top:16px; border-top:1px solid var(--line); padding-top:12px}
.sync-manual summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--ai)}
.steps a{color:var(--ai); font-weight:700}
@media (max-width:640px){ #syncBtn{margin-left:auto} #syncBtn:not([hidden]) + #themeBtn{margin-left:0} }

/* Theme picker */
.themes{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; width:100%}
.tswatch{border:2px solid var(--line); border-radius:14px; padding:8px; background:var(--paper); text-align:left; display:flex; flex-direction:column; gap:7px; transition:transform .12s, border-color .2s}
.tswatch:hover{transform:translateY(-2px)}
.tswatch.on{border-color:var(--shu)}
.tswatch .pv{height:58px; border-radius:9px; position:relative; overflow:hidden; display:flex; align-items:flex-end; gap:5px; padding:7px}
.tswatch .pv i{display:block; height:14px; border-radius:4px}
.tswatch .pv .ttl{position:absolute; top:7px; left:8px; font-size:15px; font-weight:800}
.tswatch b{font-size:13px}
.tswatch span.d{font-size:11px; color:var(--muted); line-height:1.3}
@media (max-width:640px){ :root[data-theme="code"] .statusbar{display:none} }

/* Cold Learn: the answer sheet that fills in as you go, and the results laid out like the chart */
.cl-meta{font-weight:700; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--muted)}
.cl-meta b{color:var(--ink)}
.cold .face.solo{min-height:250px}
.cold .front-kana.pop{animation:fade .25s}
.cl-under{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; min-height:34px}
.cl-last{min-width:0}
.cl-last .chipt{white-space:normal; font-size:12.5px}
.cl-last .muted{font-size:13px}
.cl-sheet{display:grid; grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:5px; margin-top:18px}
.cl-slot{aspect-ratio:1/1; display:grid; place-items:center; border-radius:8px; border:1px dashed var(--line); font-style:normal; font-family:var(--kana-font); font-size:17px; line-height:1}
.cl-slot.cur{border:2px solid var(--ai)}
.cl-slot.s-learn, .cl-slot.s-young, .cl-slot.s-master{border-style:solid}
.cl-opts{display:flex; flex-direction:column; align-items:center; gap:10px; margin:0 0 22px}
.cl-done .panel, .cl-intro .grid{text-align:left}
.cl-done > .panel{margin-bottom:22px}
.cl-done .sec-h{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.cl-done .sec-h h2{margin:0}
.cl-chart{max-width:360px; margin:0 auto}
.cl-chart + .cl-chart{margin-top:18px}
.cl-chart h3{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
.cl-chart .grid5{gap:6px}
.cell.cl-off{opacity:.3}
.cl-wrong{display:flex; flex-direction:column; gap:10px; margin-top:10px}
.cl-wrong .cl-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cl-wrong .chip{height:44px; min-width:44px; font-size:24px; padding:0 8px}
.cl-wrong .mk{margin-left:auto}
.cl-best{color:var(--matcha)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
}
/* Phones in landscape: keep content clear of the notch and the rounded corners */
.bar, main{padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
</style>
</head>

const isKata = s => /[ァ-ヺ]/.test(s);
const firstMeaningOf = m => String(m).split(/[,;]/)[0].trim();
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const splitKana = s => s.includes(' ') ? s.split(' ') : [...s];
function romajiOf(h){
  if (h.length === 1) return BASE[h];
  const b = BASE[h[0]], v = SMALL_Y[h[1]];
  if (b === 'shi' || b === 'chi') return b.slice(0,2) + v;
  if (b === 'ji') return 'j' + v;
  return b.slice(0,-1) + 'y' + v;
}
// Split a word into syllable units, keeping its original script
function kanaUnits(w){
  const h = toHira(w), out = [];
  for (let i = 0; i < h.length; i++){
    const two = h.slice(i, i+2);
    if ((SMALL_Y[h[i+1]] && BASE[h[i]]) || EXT[two]){ out.push(w.slice(i, i+2)); i++; }
    else out.push(w[i]);
  }
  return out;
}
function wordRomaji(w){
  const u = kanaUnits(w).map(toHira);
  let r = '', dbl = false;
  u.forEach((x, i) => {
    if (x === 'っ'){ dbl = true; return; }
    if (x === 'ー'){ const v = r.slice(-1); if (MACRON[v]) r = r.slice(0,-1) + MACRON[v]; return; }
    if (x === ' '){ r += ' '; return; }
    let s = EXT[x] || (x.length === 2 ? romajiOf(x) : BASE[x]) || '';
    if (x === 'ん'){ const nx = (u[i+1] && BASE[u[i+1][0]]) || ''; s = /^[aiueoy]/.test(nx) ? "n'" : 'n'; }
    if (dbl && s){ s = (s.startsWith('ch') ? 't' : s[0]) + s; dbl = false; }
    r += s;
  });
  return r;
}
// Make different romanisations comparable (shi/si, ō/ou/oo/o-, jya/ja, maccha/matcha…) while keeping
// the differences that matter: ん is marked as N first, so konnichiwa ≠ konichiwa, onna ≠ ona and kin'en ≠ kinen.
function markSyllabicN(s){
  let out = '';
  for (let i = 0; i < s.length; i++){
    const c = s[i], n = s[i + 1], after = s[i + 2] || '';
    if (c === 'm' && /[bp]/.test(n || '')){ out += 'N'; continue; }                 // Hepburn: shimbun, sampo
    if (c !== 'n'){ out += c; continue; }
    if (n === "'"){ out += 'N'; i++; continue; }                                    // kin'en, hon'ya
    if (n === 'n' && !/[aiueoy]/.test(after)){ out += 'N'; i++; continue; }         // typed nn, as on a keyboard
    if (n === 'n'){ out += 'N'; continue; }                                         // ん before the n-row: konnichiwa, onna
    out += /[aiueoy]/.test(n || '') ? 'n' : 'N';                                   // n + vowel is the n-row; otherwise ん
  }
  return out;
}
function normRomaji(s){
  s = String(s).toLowerCase().normalize('NFC').replace(/’/g, "'").replace(/\s+/g, '')
    .replace(/([aiueo])[-ー]/g, '$1$1').replace(/[-ー]/g, '')
    .replace(/ā/g,'aa').replace(/ī/g,'ii').replace(/ū/g,'uu').replace(/ē/g,'ee').replace(/ō/g,'oo')
    .replace(/cch/g, 'tch');
  return markSyllabicN(s).replace(/'/g, '')
    .replace(/ou/g,'oo').replace(/sh/g,'sy').replace(/ch/g,'ty').replace(/ts/g,'t').replace(/j/g,'zy').replace(/f/g,'h')
    .replace(/zyy/g,'zy').replace(/([szt])yi/g,'$1i').replace(/wo/g,'o');
}

const CARDS = {}, LESSONS = [];
for (const script of ['h','k']){
  ROWS.forEach(([rid, title, str], i) => {
    const lesson = {id:`${script}-${rid}`, script, title, cards:[]};
    for (const h of splitKana(str)){
      const kana = script === 'h' ? h : toKata(h);
      const id = `${script}:${kana}`;
      CARDS[id] = {id, script, h, kana, romaji:romajiOf(h), lesson:lesson.id,
        kind: i < 10 ? 'basic' : i < 13 ? 'daku' : 'combo'};
      lesson.cards.push(id);
    }
    LESSONS.push(lesson);
  });
}
const KANA_IDS = Object.keys(CARDS);
// Which kana cards (and reading guides) you need before you can read some text
function kanaReq(kana){
  const req = new Set();
  for (const u of kanaUnits(kana)){
    if ('っッー '.includes(u)) continue;
    const core = EXT[toHira(u)] ? u[0] : u;
    const id = (isKata(u) ? 'k:' : 'h:') + core;
    if (CARDS[id]) req.add(id);
  }
  const guides = [];
  if (/[っッ]/.test(kana)) guides.push('sokuon');
  if (/ー/.test(kana)) guides.push('long');
  return {req:[...req], guides};
}

}

/* =========================================================
   Kanji (data in data/kanji.js). Two kinds of card:
   kanji  — the character on its own, answered with its meaning
   kword  — a word written with kanji, answered with its reading (romaji)
   ========================================================= */
const KJ = window.KANJI_INFO || {}, SYN = window.KANJI_SYNONYMS || {}, KJ_LESSONS = [], KANJI_IDS = [], KWORD_IDS = [];
const kjRomaji = list => list.split(',').map(x => x.trim()).filter(Boolean).map(x => wordRomaji(toHira(x.replace(/\./g, '')))).join(', ');
for (const [lid, title, str] of (window.KANJI_LESSONS || [])){
  const les = {id:'kj-' + lid, script:'kj', title, level:lid.split('-')[0].toUpperCase(), cards:[]};
  for (const ch of str){
    const [meaning, on, kun, story] = KJ[ch], id = 'kj:' + ch;
    CARDS[id] = {id, script:'kj', kind:'kanji', kana:ch, meaning, accept:SYN[ch] ? meaning + ', ' + SYN[ch] : meaning, on, kun, story, romaji:firstMeaningOf(meaning), onRo:kjRomaji(on), kunRo:kjRomaji(kun), lesson:les.id};
    les.cards.push(id); KANJI_IDS.push(id);
  }
  KJ_LESSONS.push(les);
}
for (const line of (window.KANJI_WORDS || '').trim().split('\n').filter(Boolean)){
  // A reading may list alternatives after a slash (何|なに/なん): the first is taught, any is accepted
  const [word, readings, meaning] = line.split('|'), [reading, ...altReadings] = readings.split('/'), id = 'kw:' + word;
  CARDS[id] = {id, script:'kw', kind:'kword', kana:word, reading, meaning, romaji:wordRomaji(reading), alts:altReadings.map(wordRomaji), altReadings, units:kanaUnits(reading),
    kj:[...word].filter(ch => KJ[ch]).map(ch => 'kj:' + ch), ...kanaReq(reading)};
  KWORD_IDS.push(id);
}
const KANJI_LOOKS = (window.KANJI_LOOKALIKES || []).map(g => [...g]);

function romajiToKana(s, kata){
  const long = {ā:'a', ī:'i', ū:'u', ē:'e', ō:'o'};
  s = s.toLowerCase().normalize('NFC').replace(/[āīūēō]/g, ch => kata ? long[ch] + '-' : {ā:'aa', ī:'ii', ū:'uu', ē:'ei', ō:'ou'}[ch]);
  let out = '', i = 0;
  while (i < s.length){
    const c = s[i], n = s[i + 1];
    if (!/[a-z'\-]/.test(c)){ out += c; i++; continue; }            // keep kana, spaces and punctuation
    if (c === '-'){ out += 'ー'; i++; continue; }
    if (c === "'"){ i++; continue; }
    if (c === 'n' && n === 'n' && !/[aiueoy]/.test(s[i + 2] || '')){ out += 'ん'; i += 2; continue; }
    if (c === 'n' && !/[aiueoy]/.test(n || '')){ out += 'ん'; i++; continue; }
    if ((c === n && c !== 'n' && /[bcdfghjkmpqrstvwxz]/.test(c)) || (c === 't' && n === 'c' && s[i + 2] === 'h')){ out += 'っ'; i++; continue; }
    let hit = null;
    for (let len = 3; len >= 1 && !hit; len--) if (R2K[s.substr(i, len)]) hit = [R2K[s.substr(i, len)], len];
    if (hit){ out += hit[0]; i += hit[1]; } else { out += c; i++; }
  }
  if (!kata) return out;
  // In katakana a doubled vowel is a long one: koohii → コーヒー, chiizu → チーズ
  const VOWEL = {ァ:'a', ィ:'i', ゥ:'u', ェ:'e', ォ:'o', ャ:'a', ュ:'u', ョ:'o'};
  return toKata(out).replace(/([ァ-ヺ])([アイウエオ])/g, (m, a, b) => {
    const v = VOWEL[a] || (BASE[toHira(a)] || '').slice(-1);
    return v && 'aiueo'['アイウエオ'.indexOf(b)] === v ? a + 'ー' : m;
  });
}

function dueLists(now = Date.now()){

/* =========================================================
   Scheduler (SM-2 flavoured, Anki-style learning steps)
   ========================================================= */
const STEPS = [1, 10], RESTEPS = [10];

function toReview(c, ivl, today){
  c.s = 'review'; c.ivl = Math.min(Math.max(1, ivl), 3650); c.dueDay = today + c.ivl; c.lastDay = today;
  delete c.dueTs; delete c.step;
}
function schedule(prev, g, now = Date.now()){
  const c = {...prev}, today = dayNum(now);
  c.reps = (c.reps || 0) + 1;
  if (c.s === 'new'){ c.s = 'learn'; c.step = 0; c.ease = 2.5; c.lapses = 0; }

  if (c.s === 'learn'){
    if (g === 1){ c.step = 0; c.dueTs = now + STEPS[0]*MIN; }
    else if (g === 2){ const d = c.step === 0 ? (STEPS[0] + (STEPS[1] || STEPS[0]*2)) / 2 : STEPS[c.step]*1.5; c.dueTs = now + d*MIN; }
    else if (g === 3){ c.step++; if (c.step >= STEPS.length) toReview(c, 1, today); else c.dueTs = now + STEPS[c.step]*MIN; }
    else toReview(c, 4, today);
  } else if (c.s === 'relearn'){
    if (g === 1){ c.step = 0; c.dueTs = now + RESTEPS[0]*MIN; }
    else if (g === 2){ c.dueTs = now + RESTEPS[c.step]*1.5*MIN; }
    else if (g === 3){ c.step++; if (c.step >= RESTEPS.length) toReview(c, c.ivl, today); else c.dueTs = now + RESTEPS[c.step]*MIN; }
    else toReview(c, c.ivl + 1, today);
  } else {
    if (g === 1){
      c.lapses = (c.lapses || 0) + 1; c.ease = Math.max(1.3, c.ease - 0.2);
      c.ivl = Math.max(1, Math.round(c.ivl * 0.5)); c.s = 'relearn'; c.step = 0; c.dueTs = now + RESTEPS[0]*MIN;
    } else {
      const base = Math.max(c.ivl, today - (c.lastDay ?? today));
      const hard = Math.max(c.ivl + 1, Math.round(base * 1.2));
      const good = Math.max(hard + 1, Math.round(base * c.ease));
      const easy = Math.max(good + 1, Math.round(base * c.ease * 1.3));
      if (g === 2){ c.ease = Math.max(1.3, c.ease - 0.15); toReview(c, hard, today); }
      if (g === 3){ toReview(c, good, today); if (c.ease < 2.5) c.ease = Math.min(2.5, +(c.ease + 0.05).toFixed(2)); }   // ease slowly recovers
      if (g === 4){ c.ease += 0.15; toReview(c, easy, today); }
    }
  }
  return c;
}
function fmtIvl(after, now){

    if (d < 365) return (d/30).toFixed(1).replace(/\.0$/,'') + 'mo';
    return (d/365).toFixed(1).replace(/\.0$/,'') + 'y';

/* =========================================================
   Audio: recorded clips (VOICEVOX:冥鳴ひまり), one MP3 per phrase in audio/, listed in audio/list.js.
   A clip always plays to its natural end. Asking for another while one is playing waits for it
   (only the latest request waits), so moving on quickly never chops a word in half.
   ========================================================= */
const AUDIO = new Set(window.AUDIO_LIST || []);
const audioKey = t => String(t || '').replace(/\s+/g, '');

const READING_OF = new Map(KWORD_IDS.map(id => [CARDS[id].kana, CARDS[id].reading]));
const sayKey = t => { const k = audioKey(t); return AUDIO.has(k) ? k : READING_OF.get(k) || k; };
const hasAudio = t => AUDIO.has(sayKey(t));

const fnv1a = t => { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); };

function speak(text, force){

    const next = () => { if (queued) playClip(queued); };

  if (busy){ if (player.src.endsWith(audioFile(k))) return; queued = k; return; }
  playClip(k);
}

function streak(){
  let s = 0, t = dayNum();
  const days = allDays();
  if (!studied(days[t])) t--;
  while (studied(days[t])){ s++; t--; }
  return s;
}
function bestStreak(){
  const all = allDays(), days = Object.keys(all).filter(k => studied(all[k])).map(Number).sort((a, b) => a - b);
  let best = 0, run = 0;
  days.forEach((d, i) => { run = i && d === days[i-1] + 1 ? run + 1 : 1; best = Math.max(best, run); });
  return best;
}

function lookalikesOf(id){
  const c = CARDS[id];
  if (!c || c.script === 'w') return [];
  const out = new Set();
  if (c.kind === 'kanji') for (const g of KANJI_LOOKS) if (g.includes(c.kana)) g.forEach(k => k !== c.kana && out.add('kj:' + k));
  for (const g of LOOKALIKES) if (g.includes(c.kana)) g.forEach(k => k !== c.kana && out.add(kanaCardId(k)));
  for (const [a, m] of Object.entries(DB.conf)){
    if (a === id) Object.keys(m).forEach(b => out.add(b));
    else if (m[id]) out.add(a);
  }
  return [...out].filter(x => CARDS[x]);
}

function applyPattern(){
  const cs = getComputedStyle(document.documentElement);
  const bg = cs.getPropertyValue('--paper').trim(), ln = cs.getPropertyValue('--wave').trim();
  const arcs = (cx, cy) => {
    let s = `<path d="M${cx-20} ${cy}A20 20 0 0 1 ${cx+20} ${cy}Z" fill="${bg}" stroke="${ln}"/>`;
    for (const r of [15, 10, 5]) s += `<path d="M${cx-r} ${cy}A${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${ln}"/>`;
    return s;
  };
  const theme = resolvedTheme();
  const svg = theme === 'code'
    ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="10" viewBox="0 0 20 10"><circle cx="1" cy="1" r=".8" fill="${ln}"/></svg>`
    : theme === 'neon'

    : `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="0 0 40 20"><g stroke-width="1">${arcs(0,10)+arcs(40,10)+arcs(20,20)+arcs(0,30)+arcs(40,30)}</g></svg>`;
  document.documentElement.style.setProperty('--seigaiha', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);

const kanaLabel = w => { const k = CHROME_WORDS.find(([x]) => x === w); return k && !knowsAll(w) ? k[1] : w; };
const CHROME_ICONS = {復:'ふく', 新:'しん', 漢:'かん', 文:'ぶん', 読:'よ', 語:'ご', 似:'に', 記:'き', 練:'れん', 済:'す', 良:'よ', 時:'じ', 続:'ぞく', 覚:'かく', 鍵:'かぎ',
  学:'がく', 色:'いろ', 同:'どう', 入:'い', 保:'ほ'};
const knowsAll = w => [...w].every(ch => !KANJI_CH.test(ch) || kanjiKnown(ch));
const chromeOrig = new WeakMap();      // the original label, so a label outside the redrawn page (the logo) can switch back
function kanaChrome(root){
  if (!root) return;
  for (const el of root.querySelectorAll('.task-ico, .pt-ico, .kpi-ico, .vu-ico, .ret-ico, .hanko, .set-nav span, .gchip > span')){
    if (el.children.length) continue;
    const t = chromeOrig.get(el) ?? el.textContent.trim();
    if (!CHROME_ICONS[t]) continue;
    chromeOrig.set(el, t);
    const show = kanjiKnown(t) ? t : CHROME_ICONS[t];
    if (el.textContent !== show) el.textContent = show;
    el.classList.toggle('kana-icon2', show.length > 1);
  }
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (tw.nextNode()){
    const n = tw.currentNode, orig = chromeOrig.get(n) ?? n.textContent;
    if (KANJI_CH.test(orig) && n.parentElement?.closest('.eyebrow, .jp, .paper-head h2, .logo, .done h1, .pg-step')) nodes.push([n, orig]);
  }
  for (const [n, orig] of nodes){
    let t = orig;
    for (const [w, k] of CHROME_WORDS) if (t.includes(w) && !knowsAll(w)) t = t.split(w).join(k);
    if (t !== orig) chromeOrig.set(n, orig);
    if (t !== n.textContent) n.textContent = t;
  }
}
// Mark runs of Japanese text with lang="ja", so screen readers use a Japanese voice and kanji use Japanese glyph forms
const JA_CHAR = /[ぁ-ゖァ-ヺー一-龯々〆ヶ]/, LATIN_CHAR = /[A-Za-z]/;
function markJapanese(root){
  if (!root) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const els = new Set();
  while (tw.nextNode()){
    const t = tw.currentNode.textContent, el = tw.currentNode.parentElement;
    if (el && JA_CHAR.test(t) && !LATIN_CHAR.test(el.textContent) && !el.closest('[lang="ja"]')) els.add(el);
  }
  for (const el of els) el.lang = 'ja';
}

        : kjUnseen ? 'Today’s kanji limit reached'
        : waiting ? (dueNow ? `Practise these ${dueNow} to open the next set` : 'The next set opens once these are learned — they’ll be back for practice soon')
        : 'Every kanji is learned';
      return task('漢', 'Kanji', detail, !kjQueue.length && !kjUnseen && !(waiting && dueNow),
        kjQueue.length ? `<button class="btn" data-act="kanji-learn">Learn ${Math.min(lessonSize(), kjQueue.length)} →</button>` : kjUnseen ? '<button class="btn" data-act="kanji-more">+5 more</button>' : waiting && dueNow ? '<button class="btn" data-act="start">Practise →</button>' : ok);
    })() : '',
    kanjiOpen() ? (() => { const gn = gramNext(), gd = gramDue().length;
      return task('文', 'Grammar', gd ? `${gd} point${gd === 1 ? '' : 's'} to review${gn ? ` · next: ${gn.title}` : ''}` : gn ? `Next: ${gn.title} — ${gn.sub}` : 'Every point passed', !gd && !gn,
        gd ? '<button class="btn" data-act="gram-review">Review →</button>' : gn ? `<button class="btn" data-act="gram-learn" data-id="${gn.id}">Learn →</button>` : ok); })() : '',
    READER.some(readerUnlocked) ? (() => { const nx = READER.find(t => readerUnlocked(t) && !DB.read[t.id]), rdToday = dToday.rd || 0;
      return task('読', 'Reading', nx ? `New text: ${nx.en}` : rdToday ? `${rdToday} text${rdToday === 1 ? '' : 's'} read today` : 'Re-read a text, or pass more grammar for new ones', !nx,
        nx ? `<button class="btn" data-act="read-open" data-id="${nx.id}">Read →</button>` : '<button class="btn" data-act="go" data-view="read">Texts →</button>'); })() : '',
    retDue ? task('記', 'Retention check', `${retDue} thing${retDue === 1 ? '' : 's'} you learned 1, 3 or 7 days ago`, false, '<button class="btn" data-act="ret-start">Check →</button>') : '',
    task('練', 'Copybook', cbToday ? `${cbToday} page${cbToday === 1 ? '' : 's'} today` : 'Read and write a page', cbToday > 0,
      `<button class="btn" data-act="go" data-view="copybook">${cbToday ? 'Another page' : 'Write a page'} →</button>`),
  ].filter(Boolean);
  // Keep the plan short: up to four open tasks (the rest behind "more"), finished ones folded into one line
  const openT = allTasks.filter(h => !h.includes('task is-done')), doneT = allTasks.filter(h => h.includes('task is-done'));
  const shown = todayAll ? openT : openT.slice(0, 4);
  const tasks = shown.join('')
    + (openT.length > shown.length ? `<button class="task-more" data-act="today-more">+ ${openT.length - shown.length} more for today</button>` : '')
    + (doneT.length ? `<div class="task-donerow"><span class="task-ok">✓</span><span>${openT.length ? 'Done' : 'All done'}: ${doneT.map(h => h.match(/data-title="([^"]*)"/)[1]).join(' · ')}</span></div>` : '');

  // Practice
  const drillSets = drillPool().length, guidesDone = GUIDES.filter(g => DB.guides[g.id]).length;
  const vocabLearned = VOCAB_IDS.filter(id => st(id).s === 'review').length;
  const tile = (glyph, title, line, attrs, disabled) => `<button class="ptile" ${attrs} ${disabled ? 'disabled' : ''}><span class="pt-ico jp">${glyph}</span><span class="pt-t"><b>${title}</b><span>${line}</span></span></button>`;
  const learnedN = practicePool('mix').length, coldN = clScope().ids.length;
  const practice = `<section class="practice">
    <div class="ptile wide${learnedN ? '' : ' off'}"><span class="pt-ico jp">復</span><span class="pt-t"><b>Practise learned cards</b><span>${learnedN ? `${learnedN} learned cards · any time · your schedule isn’t affected` : 'Unlocks after your first lesson'}</span></span>
      ${learnedN ? `<span class="pt-acts"><button class="btn sm" data-act="fc-start" data-scope="mix">⟲ Flashcards</button><button class="btn sm primary" data-act="practice">Quiz me →</button></span>` : ''}</div>
    ${tile('語', 'Vocabulary', `${vocabLearned} learned · ${VOCAB_IDS.length} words`, 'data-act="go" data-view="vocab"')}
    ${tile('似', 'Lookalike drill', drillSets ? `${drillSets} confusable set${drillSets === 1 ? '' : 's'} ready` : 'Unlocks with similar kana or kanji', 'data-act="drill"', !drillSets)}
    ${tile('読', 'Reading guides', `${guidesDone}/${GUIDES.length} complete`, 'data-act="go" data-view="guides"')}
    ${tile('あ', 'Cold Learn', coldN ? `${coldN} ${SCRIPT_NAME[clScope().sc].toLowerCase()} you know · shuffled · no hints` : 'Unlocks after your first lesson', 'data-act="cold"', !coldN)}
  </section>`;

  // Sidebar: streak, progress, coming up, kana of the day, trouble spots
  const s = streak();
  const week = Array.from({length:7}, (_, i) => today - 6 + i).map(d => {
    const lbl = dayDate(d).toLocaleDateString(undefined, {weekday:'short', timeZone:'UTC'});
    return `<span class="wd"><i class="${studied(days[d]) ? 'on' : ''}${d === today ? ' is-today' : ''}" data-tip="${lbl}: ${Math.round((days[d]?.ms || 0) / 60000)} min"></i><small>${lbl.slice(0, 1)}</small></span>`;
  }).join('');
  const streakCard = `<section class="panel streak-card">
    <div class="streak-n"><b>${s}</b><span>day${s === 1 ? '' : 's'} in a row<small>best ${bestStreak()}</small></span></div>
    <div class="week">${week}</div>
    <div class="today-meter"><span><b>${dToday.r || 0}</b>reviews</span><span><b>${dToday.n || 0}</b>new</span><span><b>${Math.round((dToday.ms || 0) / 60000)}</b>min today</span></div>
  </section>`;

  const progress = [
    ['Hiragana', KANA_IDS.filter(id => CARDS[id].script === 'h'), 'var(--shu)'],
    ['Katakana', KANA_IDS.filter(id => CARDS[id].script === 'k'), 'var(--ai)'],
    ['Words', WORD_IDS, 'var(--matcha)'],
    ['Vocabulary', VOCAB_IDS, 'var(--gold)'],
    ['Kanji', openKanjiIds(), 'var(--ink-2)'],
  ].filter(([, ids]) => ids.length).map(([name, ids, col]) => {
    const tot = ids.length, l = ids.filter(id => st(id).s === 'review').length, m = ids.filter(id => strength(id) === 'master').length;
    return `<div class="prog" data-tip="${l} learned · ${m} mastered (21+ day interval) · ${tot - l} to go">
      <div class="prog-h"><b>${name}</b><span>${l}<small>/${tot}</small></span></div>
      ${meterHTML([[m / tot * 100, col], [(l - m) / tot * 100, `color-mix(in srgb,${col} 45%,transparent)`]])}</div>`;
  }).join('');

  const fc = Array(7).fill(0);
  for (const [id, c] of Object.entries(DB.cards)){
    if (!CARDS[id] || !cardOn(id)) continue;
    if (c.s === 'review'){ const d = c.dueDay - today; if (d <= 0) fc[0]++; else if (d < 7) fc[d]++; }
    else if (c.s === 'learn' || c.s === 'relearn') fc[0]++;
  }
  const fmax = Math.max(1, ...fc);
  const forecast = fc.map((n, i) => {
    // Named from the study day (which rolls over at 4 a.m.), not the clock: at 1 a.m. tomorrow's reviews are still "tomorrow"
    const lbl = i === 0 ? 'Today' : dayDate(today + i).toLocaleDateString(undefined, {weekday:'short', timeZone:'UTC'});
    return `<div class="fc" data-tip="${lbl}: ${n} card${n === 1 ? '' : 's'}"><span class="n">${n || ''}</span><div class="b" style="height:${Math.max(3, n / fmax * 100)}%"></div><span class="d">${i === 0 ? 'Now' : lbl.slice(0, 2)}</span></div>`;
  }).join('');

  const kanaCards = KANA_IDS.map(id => CARDS[id]);
  const pool = kanaCards.filter(c => c.kind === 'basic' && (HIRA_INFO[c.kana] || KATA_WORDS[c.kana]));
  const kd = pool[((today % pool.length) + pool.length) % pool.length];
  const kw = kd.script === 'h' ? HIRA_INFO[kd.kana].slice(1) : KATA_WORDS[kd.kana];

  const leeches = Object.keys(CARDS).filter(isLeech);
  const trouble = leeches.length ? `<section class="panel side-card">
    <div class="sec-h"><h2>Trouble spots</h2>${drillSets ? '<button class="linkbtn" data-act="drill">Drill →</button>' : ''}</div>
    <p class="sub">These keep slipping. Tap one to write your own memory aid.</p>
    <div class="trouble">${leeches.map(id => `<button class="chip s-learn" data-act="detail" data-id="${id}" data-tip="${esc(CARDS[id].romaji)} · missed ${st(id).lapses}×">${CARDS[id].kana}</button>`).join('')}</div>
  </section>` : '';

  // Course map: each alphabet folds; the one you're working through starts open
  const upNext = unseen[0] && CARDS[unseen[0]].lesson;
  const course = ['h', 'k'].map(sc => {
    const ls = LESSONS.filter(l => l.script === sc), ids = ls.flatMap(l => l.cards);
    const l = ids.filter(id => st(id).s === 'review').length;
    const open = courseOpen ? courseOpen[sc] : (upNext ? upNext.startsWith(sc + '-') : sc === 'h');
    const rows = ls.map(les => {
      const on = DB.settings.lessons[les.id];
      const seen = les.cards.filter(id => st(id).s !== 'new').length, done = les.cards.filter(id => st(id).s === 'review').length;
      return `<div class="lesson${on ? '' : ' off'}">
        <div class="lesson-h">
          <div class="ttl">${les.title}${les.id === upNext ? '<span class="tag">Up next</span>' : ''}</div>
          <div class="cnt">${seen}/${les.cards.length} introduced${seen ? ` · <button class="linkbtn" data-act="relearn" data-lesson="${les.id}">↺ Relearn</button>` : ''}</div>
          ${meterHTML([[done / les.cards.length * 100, 'var(--matcha)'], [(seen - done) / les.cards.length * 100, 'color-mix(in srgb,var(--shu) 55%,transparent)']], 'sm')}
        </div>
        <div class="chips">${les.cards.map(id => `<button class="chip s-${strength(id)}" data-act="detail" data-id="${id}" data-tip="${CARDS[id].romaji}">${CARDS[id].kana}</button>`).join('')}</div>
        <label class="switch" data-tip="${on ? 'On: in lessons, reviews, practice, flashcards and the copybook' : 'Off: left out everywhere until you switch it back on — progress is kept'}"><input type="checkbox" data-lesson="${les.id}" ${on ? 'checked' : ''} aria-label="Study ${SCRIPT_NAME[sc]} ${les.title}"><span></span></label>
      </div>`;
    }).join('');
    return `<details class="script" data-script="${sc}" ${open ? 'open' : ''}>
      <summary><span class="sname jp">${SCRIPT_JP[sc]}</span><span class="sinfo"><b>${SCRIPT_NAME[sc]}</b><small>${sc === 'h' ? 'The core script — start here' : 'Loanwords and emphasis'}</small></span>
        <span class="scount">${l}<small>/${ids.length}</small></span>${meterHTML([[l / ids.length * 100, sc === 'h' ? 'var(--shu)' : 'var(--ai)']], 'sm')}<span class="chev" aria-hidden="true">›</span></summary>
      <div class="lessons">${rows}</div></details>`;
  }).join('');

  return `<div class="home">
    <header class="home-head">
      <p class="eyebrow"><span class="jp">${gjp}</span> · ${gen}</p>
      <h1>${headline}</h1>
      <p class="sub">${subline}</p>
    </header>
    ${tracksBannerHTML()}
    ${readBannerHTML()}
    ${Object.keys(DB.cards).length ? pathGuideHTML() : ''}
    <div class="home-grid">
      <div class="home-main">
        <section class="panel today-card">
          <div class="sec-h"><h2>Today</h2><span class="muted">${new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'})}</span></div>
          <div class="tasks">${tasks}</div>
        </section>
        ${syncHintHTML()}
        ${practice}
        <section class="panel course">
          <div class="sec-h"><h2>Course</h2>${legendHTML()}</div>
          <p class="sub">New cards come in order from the sets you switch on. Tap any kana for details and your own memory aid.</p>
          ${course}
        </section>
      </div>
      <aside class="home-side">
        ${streakCard}
        <section class="panel side-card"><div class="sec-h"><h2>Progress</h2><button class="linkbtn" data-act="tips">How to master →</button></div><div class="progs">${progress}</div></section>
        <section class="panel side-card"><div class="sec-h"><h2>Coming up</h2><span class="muted">reviews · 7 days</span></div><div class="forecast">${forecast}</div></section>
        <section class="panel side-card kotd2">
          <div class="sec-h"><h2>Kana of the day</h2><span class="muted">${SCRIPT_NAME[kd.script]}</span></div>
          <div class="kotd-row"><span class="big kana">${kd.kana}</span><div><b class="rom">${kd.romaji}</b><div class="word"><span class="kana">${kw[0]}</span> ${kw[1]} · ${kw[2]}</div></div></div>
        </section>
        ${trouble}
      </aside>
    </div>
  </div>`;
}
function legendHTML(){
  return `<div class="legend"><span><i style="background:var(--paper)"></i>Not seen</span><span><i class="s-learn"></i>Learning</span><span><i class="s-young"></i>Young</span><span><i class="s-master"></i>Mastered</span></div>`;
}
function nextDueText(now, today){
  let best = Infinity;
  for (const [id, c] of Object.entries(DB.cards)) if (CARDS[id] && cardOn(id) && c.dueTs && c.dueTs < best) best = c.dueTs;
  if (best !== Infinity){
    const m = Math.max(1, Math.round((best - now - 20*MIN) / MIN));
    return m < 60 ? `in ${m} min` : `in ${Math.round(m/60)} h`;
  }
  let d = Infinity;
  for (const [id, c] of Object.entries(DB.cards)) if (c.s === 'review' && CARDS[id] && cardOn(id)) d = Math.min(d, c.dueDay - today);
  if (d === Infinity) return '';
  return d <= 1 ? 'tomorrow' : `in ${d} days`;
}

  return `<div class="box" data-mnbox="${id}"><div class="lbl">Memory aid <button class="linkbtn" data-act="mn-edit" data-id="${id}">Add</button></div><span class="muted">${['w', 'v', 'kw'].includes(c.script) ? 'Link the sound to the meaning with a quick image.' : 'Invent a picture or story for this shape — your own ones stick best.'}</span></div>`;
}

  }

  const twin = c.script === 'h' ? toKata(c.kana) : c.h;

  if (NOTES[c.id]) boxes.push(`<div class="box note"><div class="lbl">Note</div>${NOTES[c.id]}</div>`);

function partsHTML(c){
  if (c.kind === 'daku'){
    const nfd = c.h.normalize('NFD');
    const base = c.script === 'h' ? nfd[0] : toKata(nfd[0]);
    return `<span class="kana">${base}</span> + ${nfd[1] === '゙' ? '<span class="kana">゛</span> dakuten' : '<span class="kana">゜</span> handakuten'}`;
  }
  if (c.kind === 'combo') return `<span class="kana">${c.kana[0]}</span> + small <span class="kana">${c.kana[1]}</span> → one syllable`;
  if (isWordish(c)) return c.units.map(u => {
    const r = u === 'っ' || u === 'ッ' ? 'pause' : u === 'ー' ? 'long' : wordRomaji(u);
    return `<span class="unit"><span class="kana">${u}</span><small>${r}</small></span>`;
  }).join('');
  return '';
}
function wordNotes(c){
  const n = [];
  if (/[っッ]/.test(c.kana)) n.push('Small っ doubles the next consonant.');
  if (/ー/.test(c.kana)) n.push('ー stretches the vowel before it.');
  if (/'/.test(c.romaji)) n.push('The apostrophe keeps ん separate from the next vowel or y.');
  return n.length ? `<div class="box note"><div class="lbl">Reading tip</div>${n.join(' ')}</div>` : '';
}
const wordSize = (c, max) => `font-size:min(${max}px, calc(86cqw / ${c.kana.length}))`;
// Can a wrong typed answer be forgiven? Meanings: always ("my answer was right"). Readings: only near-misses.
const canForgive = (c, typed) => !!typed && !!typed.text && (asksMeaning(c) || !!typed.hint);
const forgiveLabel = c => asksMeaning(c) ? '✓ My answer was right' : '⌨ Typo';
const isWordish = c => c.kind === 'word' || c.kind === 'vocab' || c.kind === 'kword';
// Vocabulary and kanji are answered with a meaning; everything else with a reading
const asksMeaning = c => c.kind === 'vocab' || c.kind === 'kanji';
// Kana and words are answered in romaji (spaces and case don't matter); vocabulary in English (spaces do)
// Where the kana aren't on screen (kanji words, dictation), a reading can also be typed in kana with a
// Japanese keyboard; it's checked as the romaji it spells. Where the kana are shown, typing them back would just be copying.
const kanaToRomaji = t => /^[ぁ-ゖァ-ヺー\s]+$/.test(t) && /[ぁ-ゖァ-ヺ]/.test(t) ? wordRomaji(t.replace(/\s+/g, '')) : t;
const answerText = (c, raw) => {
  const t = String(raw || '').trim();
  if (asksMeaning(c)) return t;
  return (c.kind === 'kword' ? kanaToRomaji(t) : t).toLowerCase().replace(/\s+/g, '');
};
const answerTypo = (c, text) => asksMeaning(c) ? meaningTypo(text, c.accept || c.meaning) : !typedAsOther(c, text) && readingsOf(c).some(r => looksLikeTypo(text, r));
const kanjiLine = c => kanjiShown(c) ? `<div class="vkanji" lang="ja">${esc(kanjiShown(c))}</div>` : '';
function vocabBackHTML(c){
  return `<div class="face-top"><span class="pill">Vocab</span>${sayBtn(c.kana)}</div>
    <div class="word-head"><div class="kana" style="${wordSize(c, 54)}">${c.kana}</div>${kanjiLine(c)}<div class="vmean">${esc(c.meaning)}</div><div class="rom" style="font-size:18px">${c.romaji}</div></div>
    ${typeof S !== 'undefined' && S && S.cur === c.id ? verdictHTML(c) : ''}
    <div class="info">${c.note ? `<div class="box note"><div class="lbl">Note</div>${esc(c.note)}</div>` : ''}${mnBoxHTML(c.id)}</div>`;
}

/* ---------- kanji card faces ---------- */
// On a kanji's own card you see kanji you've learned plus its set-mates (they're learned together).
// Memory aids name other kanji as building blocks: one you haven't reached is written as its reading,
// and example words appear only once you know every kanji in them.
function kanjiAllowedOn(c){
  const mates = new Set([c.kana, ...((c.lesson && lessonById(c.lesson)?.cards) || []).map(id => CARDS[id].kana)]);
  return ch => !KANJI_CH.test(ch) || mates.has(ch) || kanjiKnown(ch);
}
const kanjiAsKana = ch => { const [m, on, kun] = KJ[ch]; const k = String(kun || '').split(',')[0].trim().split('.')[0]; return k || toHira(String(on || '').split(',')[0].trim()); };
const storyFor = c => esc(String(c.story || '').replace(/[一-龯々]/g, ch => KJ[ch] && !kanjiAllowedOn(c)(ch) ? kanjiAsKana(ch) : ch));
const kjReadings = c => `<div class="kj-reads">${c.on ? `<div><span class="lbl">On</span><b class="kana">${c.on}</b><small>${c.onRo}</small></div>` : ''}${c.kun ? `<div><span class="lbl">Kun</span><b class="kana">${c.kun.replace(/\./g, '')}</b><small>${c.kunRo}</small></div>` : ''}</div>`;
function kjExamplesHTML(c, n = 3){
  const ok = kanjiAllowedOn(c), ws = kanjiWordsWith(c.kana).filter(id => [...CARDS[id].kana].every(ok)).slice(0, n);
  if (!ws.length) return '';
  return `<div class="box"><div class="lbl">In words</div>${ws.map(id => { const w = CARDS[id]; return `<div class="wordrow"><button class="w kana linkish" data-act="detail" data-id="${id}">${w.kana}</button><span class="m">${w.reading} · ${w.romaji} · ${esc(w.meaning)}</span></div>`; }).join('')}</div>`;
}
function kanjiBoxesHTML(c){
  const boxes = [];
  if (isLeech(c.id)) boxes.push(`<div class="box leech"><div class="lbl">Leech · missed ${st(c.id).lapses}×</div>This one keeps slipping. Write your own memory aid below.</div>`);
  boxes.push(mnBoxHTML(c.id));

/* ---------- study session (only cards that have been taught) ---------- */
function startSession(){
  const {learn, rev} = dueLists();
  if (!learn.length && !rev.length) return;
  L = null;
  S = {learn, main:shuffle(rev), done:0, good:0, newIntro:0, rts:[], start:Date.now(), cur:null, revealed:false, typed:null, last:null};
  view = 'study';
  nextCard();
}
function nextCard(){
  const now = Date.now();
  S.learn.sort((a, b) => st(a).dueTs - st(b).dueTs);
  const dueL = S.learn.filter(x => st(x).dueTs <= now);
  let id = dueL.find(x => x !== S.last);
  if (!id && S.main.length) id = S.main.shift();
  if (!id && dueL.length) id = dueL[0];
  if (!id && S.learn.length) id = S.learn.find(x => x !== S.last) || S.learn[0];
  if (!id) return finish();
  S.learn = S.learn.filter(x => x !== id);
  Object.assign(S, {cur:id, revealed:false, typed:null, last:id, rt:null, slow:false, firstKey:null});
  render();
  S.shownAt = performance.now();
}
function finish(){
  lastSummary = {done:S.done, good:S.good, newIntro:S.newIntro, ms:Date.now() - S.start, avg:S.rts.length ? sum(S.rts)/S.rts.length : 0};
  S = null; view = 'done'; render();
}
function quit(){ S = null; view = 'home'; render(); }

function studyHTML(){

  const pill = c.kind === 'word' ? `Word · ${c.kata ? 'Katakana' : 'Hiragana'}` : c.kind === 'vocab' ? 'Vocab · meaning' : c.kind === 'kanji' ? 'Kanji · meaning' : c.kind === 'kword' ? 'Kanji word · reading' : SCRIPT_NAME[c.script];

// What Space / Enter answers with. A wrong answer is Again; anything you got right is Good. Being slow is
// shown, but never quietly turned into Hard: Hard lowers a card's ease for good, and slowness alone

function suggested(){
  if (S.typed && !S.typed.ok && S.typed.kind !== 'typo') return 1;
  return 3;
}
function setReviewMistake(kind){
  if (!S || !S.revealed || !S.typed || S.typed.ok || !S.typed.text) return;
  if (kind === 'typo' && !canForgive(CARDS[S.cur], S.typed)) return;
  S.typed.kind = kind; S.typed.picked = true;

  document.getElementById('answer').innerHTML = answerHTML();
}
function answerHTML(){
  if (!S.revealed){
    if (DB.settings.mode === 'type')
      return `<form class="typein" data-form="type"><input id="typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${asksMeaning(CARDS[S.cur]) ? 'Type the meaning…' : 'Type the romaji…'}" aria-label="Your answer"><button class="btn primary">Check</button></form>`;
    return `<button class="btn primary reveal" data-act="reveal">Show answer</button>`;
  }
  const now = Date.now(), s = st(S.cur);
  const labels = [['Again','もう一回'],['Hard','難しい'],['Good','良い'],['Easy','簡単']].map(([l, j]) => [l, kanaLabel(j)]);
  const sug = S.typed || S.slow ? suggested() : 0;
  return `<div class="rate">${labels.map(([l, j], i) => {
    const g = i + 1;
    return `<button class="r${g}${g === sug ? ' sug' : ''}" data-act="rate" data-g="${g}"><span class="i">${fmtIvl(schedule(s, g, now), now)}</span><span class="l">${l}</span><span class="j">${j}</span></button>`;
  }).join('')}</div>`;
}
function accepted(c){
  const r = c.romaji, set = new Set([r]);
  const alts = {shi:['si'], chi:['ti','ci'], tsu:['tu'], fu:['hu'], ji:['zi'], wo:['o'], n:['nn',"n'"]};
  (alts[r] || []).forEach(a => set.add(a));
  if (c.h === 'ぢ') set.add('di');
  if (c.h === 'づ') set.add('du');
  if (c.kind === 'combo'){
    const v = r.slice(-1);

}
// Every reading a card accepts: its main one plus any alternatives (何: nani / nan)
const readingsOf = c => [c.romaji, ...(c.alts || [])];
const isCorrect = (c, text) => !!text && (asksMeaning(c) ? meaningCorrect(text, c.accept || c.meaning)
  : c.kind === 'word' || c.kind === 'kword' ? readingsOf(c).some(r => normRomaji(text) === normRomaji(r)) : accepted(c).has(text));
function reveal(){
  if (!S || S.revealed) return;
  const c = CARDS[S.cur];
  S.revealed = true;
  S.rt = ((DB.settings.mode === 'type' && S.firstKey ? S.firstKey : performance.now()) - S.shownAt) / 1000;
  S.slow = +DB.settings.speed > 0 && S.rt > speedTarget(c) && !(S.typed && !S.typed.ok);
  if (DB.settings.autoplay !== false) speak(c.kind === 'kword' ? c.reading : c.kana);
  document.getElementById('card').classList.add('flipped');
  document.getElementById('card').removeAttribute('data-act');
  document.querySelector('.face.back').innerHTML = backHTML(c);
  document.getElementById('answer').innerHTML = answerHTML();
  document.activeElement?.blur();

}
function submitTyped(){
  const c = CARDS[S.cur], text = answerText(c, document.getElementById('typed')?.value), ok = isCorrect(c, text);
  S.typed = {text, ok, kind:'know', hint:!ok && answerTypo(c, text)};

function logConfusion(target, other){
  if (!other || other === target) return;
  (DB.conf[target] ||= {})[other] = (DB.conf[target][other] || 0) + 1;
}
function unlogConfusion(target, other){
  const m = DB.conf[target];
  if (!m || !m[other]) return;
  if (--m[other] <= 0) delete m[other];
  if (!Object.keys(m).length) delete DB.conf[target];
}
// The kana you typed instead, if your answer is another kana's reading (a real mix-up, not a typo)
const typedAsOther = (c, text) => isWordish(c) ? null : KANA_IDS.find(x => x !== c.id && CARDS[x].script === c.script && accepted(CARDS[x]).has(text)) || null;
function logConfusionFromTyping(id, text){
  const other = typedAsOther(CARDS[id], text);
  logConfusion(id, other);
  return other;
}

/* ---------- mistakes: typo vs didn't know ---------- */
const MISTAKE_SOURCES = {review:'Flashcard reviews', lesson:'Lesson checks', copybook:'Copybook', drill:'Lookalike drills', cold:'Cold Learn', retention:'Retention checks', practice:'Practice', grammar:'Grammar', reading:'Reading'};
// Every mistake starts as "didn't know"; marking it a typo moves it across
function recordMistake(src, kind, n = 1){
  const m = (DB.mist[src] ||= {know:0, typo:0});
  m[kind] = Math.max(0, (m[kind] || 0) + n);
  const d = dayLog(dayNum());
  d.mk ||= {know:0, typo:0};
  d.mk[kind] = Math.max(0, (d.mk[kind] || 0) + n);
}
function reclassify(src, from, to){ recordMistake(src, from, -1); recordMistake(src, to, 1); }
// One wrong, missing, extra or swapped letter
function oneOff(a, b){
  if (a === b || Math.abs(a.length - b.length) > 1) return false;
  if (a.length === b.length){
    const diff = [...a].map((ch, i) => ch !== b[i] ? i : -1).filter(i => i >= 0);
    return diff.length === 1 || (diff.length === 2 && diff[1] === diff[0] + 1 && a[diff[0]] === b[diff[1]] && a[diff[1]] === b[diff[0]]);
  }
  const [s, l] = a.length < b.length ? [a, b] : [b, a];
  for (let i = 0; i < l.length; i++) if (s === l.slice(0, i) + l.slice(i + 1)) return true;
  return false;
}
// A wrong answer that's one letter away from the right one (and isn't another real reading) is probably a slip
const looksLikeTypo = (typed, expected) => !!typed &&
  (oneOff(typed.toLowerCase(), expected.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')) || oneOff(normRomaji(typed), normRomaji(expected)));
const MK_FEEDBACK = {
  review:{know:'Counted as a miss. Press <b>Again</b> (highlighted) and it comes back in a few minutes — have a look at the memory aid first.', typo:'Counted as a slip, so it won’t count against you. <b>Good</b> is highlighted.'},
  copybook:{know:'Counted as a miss. It goes on your <b>Most missed</b> list so it comes round again.', typo:'Counted as a typo — you keep the point.'},
  retention:{know:'Noted as forgotten. You can relearn it at the end of the check.', typo:'Counted as remembered — it was just a slip.'},
};
const mkNoteHTML = (ctx, kind) => `<div class="mk-note ${kind === 'typo' ? 'typo' : 'know'}">${kind === 'typo' ? '⌨' : '✗'} ${MK_FEEDBACK[ctx][kind === 'typo' ? 'typo' : 'know']}</div>`;
// A wrong reading can only be forgiven as a typo when it's one letter off (hint); a wrong meaning can
// always be overruled, because English has more synonyms than any list can hold.
function mkChoiceHTML(kind, attrs, hint, typoLabel = '⌨ Typo', canTypo = true){
  if (!canTypo) return '';
  return `<span class="mk">${hint ? '<span class="mk-hint">Looks like a typo?</span>' : ''}<button class="mk-b${kind === 'typo' ? ' on typo' : ''}" data-kind="typo" ${attrs} data-tip="${typoLabel.includes('right') ? 'Your answer means the same thing — count it as right' : 'You knew it — it was a slip'}">${typoLabel}</button><button class="mk-b${kind !== 'typo' ? ' on' : ''}" data-kind="know" ${attrs}>✗ Didn’t know</button></span>`;
}
function answer(g){
  if (!S || !S.revealed) return;
  const id = S.cur, before = st(id), now = Date.now(), today = dayNum(now);
  const after = schedule(before, g, now);
  const rt = Math.min(S.rt ?? 0, 30);
  after.rt = before.rt ? +(before.rt*0.7 + rt*0.3).toFixed(2) : +rt.toFixed(2);
  after.u = Date.now();
  DB.cards[id] = after;
  const d = dayLog(today);
  d.r++; if (g > 1){ d.c++; S.good++; }
  if (before.s === 'review'){ d.rv = (d.rv || 0) + 1; if (g > 1) d.rc = (d.rc || 0) + 1; }
  if (before.s === 'new'){ d.n++; if (CARDS[id].kind === 'word') newCounter().w++; else newCounter().n++; S.newIntro++; }
  // Log the mistake (and the kana mix-up) only for real misses, not typos you marked
  if (S.typed && !S.typed.ok){
    recordMistake('review', S.typed.kind === 'typo' ? 'typo' : 'know');
    if (S.typed.kind !== 'typo' && S.typed.text) logConfusionFromTyping(id, S.typed.text);
  } else if (g === 1) recordMistake('review', 'know');
  S.done++; S.rts.push(rt);
  if (after.s === 'learn' || after.s === 'relearn') S.learn.push(id);
  save();
  nextCard();
}

/* ---------- lessons: teach first, quick check, then into reviews ---------- */
let L = null;
const lessonSize = () => Math.min(20, Math.max(1, Math.round(+DB.settings.lessonSize || 5)));
const lessonQueue = () => unseenQueue().slice(0, newLeft()).concat(unseenWords().slice(0, wordsLeft()), unseenVocab().slice(0, vocabLeft()));
const vocabLessonQueue = () => unseenVocab().slice(0, vocabLeft());
function batchNoun(ids){
  if (ids.every(id => CARDS[id].kind === 'kanji')) return 'kanji';
  if (ids.every(id => CARDS[id].kind === 'kword')) return ids.length === 1 ? 'kanji word' : 'kanji words';
  const words = ids.filter(id => CARDS[id].kind === 'word').length, vocab = ids.filter(id => CARDS[id].kind === 'vocab').length;
  if (vocab === ids.length) return ids.length === 1 ? 'vocab word' : 'vocab words';
  return words === ids.length ? (ids.length === 1 ? 'word' : 'words') : words || vocab ? 'cards' : 'kana';
}
// opts.ids: relearn already-taught cards (practice only, the review schedule is untouched)
// opts.lesson: show that set's intro slide first
function startLesson(opts = {}){
  const review = !!opts.ids;
  const items = review ? opts.ids : (opts.vocab ? vocabLessonQueue() : opts.kanji ? kanjiLessonQueue() : lessonQueue()).slice(0, lessonSize());
  if (!items.length) return;
  const slides = [];
  if (review && opts.lesson) slides.push({type:'intro', lesson:opts.lesson});
  let wordIntro = false, vocabIntro = false;
  for (const id of items){
    const c = CARDS[id];
    if (review){ slides.push({type:'item', id}); continue; }
    if (c.kind === 'kanji'){
      if (!KANJI_IDS.some(x => st(x).s !== 'new') && !slides.some(s => s.type === 'kanjiintro')) slides.push({type:'kanjiintro'});
      const les = lessonById(c.lesson);
      if (les.cards.every(x => st(x).s === 'new') && !slides.some(s => s.lesson === les.id)) slides.push({type:'intro', lesson:les.id});
    } else if (c.kind === 'kword'){
      if (!KWORD_IDS.some(x => st(x).s !== 'new') && !slides.some(s => s.type === 'kwordintro')) slides.push({type:'kwordintro'});
    } else if (c.kind === 'vocab'){
      if (!vocabIntro && VOCAB_IDS.every(v => st(v).s === 'new')) slides.push({type:'vocabintro'});
      vocabIntro = true;
    } else if (c.kind === 'word'){
      if (!wordIntro && WORD_IDS.every(w => st(w).s === 'new')) slides.push({type:'wordintro'});
      wordIntro = true;
    } else {
      const les = lessonById(c.lesson);
      if (les.cards.every(x => st(x).s === 'new') && !slides.some(s => s.lesson === les.id)) slides.push({type:'intro', lesson:les.id});
    }
    slides.push({type:'item', id});
  }

function practicePool(scope){

    if (scope === 'mix') return true;

    if (scope === 'v') return c.kind === 'vocab';

/* ---------- grammar (data in data/grammar.js) ----------

const GRAMMAR = window.GRAMMAR || [];
const gramPassed = id => !!DB.gram[id]?.p;
const gramUnlocked = i => kanjiOpen() && (i === 0 || gramPassed(GRAMMAR[i - 1].id));

function gramQuestion(g, q){
  const out = {gid:g.id, q};

    const w = q.w.split(' ');
    let tiles = shuffle(w.map((x, i) => ({x, i})));

/* ---------- reader (data in data/reader.js) ----------
   Short graded texts that unlock with the grammar they use. Tap any word for its reading and meaning;
   furigana shows on kanji you haven't learned yet (or always / never, your choice). */
const READER = window.READER || [], RGLOSS = window.READER_GLOSS || {};
const PARTICLE_GLOSS = {は:'topic marker (read “wa”)', が:'subject marker; (after a sentence) but', を:'object marker (read “o”)', に:'at, to, on (a time or place)', へ:'towards (read “e”)',

const grammarOpen = () => kanjiOpen();

const kanjiKnown = ch => { const s = st('kj:' + ch).s; return s === 'review' || s === 'relearn'; };
// One token of a text: surface form, reading, and HTML with furigana where wanted
function readToken(tok){
  const m = tok.match(/^([「『（]*)(.*?)([。、？！?!」』）]*)$/), pre = m[1], body = m[2], punct = m[3];
  const surface = body.replace(/\[[^\]]*\]/g, '');

  // Modes: kana (default) writes kanji you haven't learned in kana, so text only shows kanji you know;
  // unknown adds furigana over kanji you haven't learned; all adds it everywhere; none shows plain kanji.
  const mode = furiMode(), unknown = kj => [...kj].some(ch => !kanjiKnown(ch));

  const html = body.replace(/([一-龯々〆ヶ]+)\[([^\]]+)\]/g, (all, kj, rd) => {
    if (mode === 'kana' && unknown(kj)){ hidden = true; return rd; }
    const show = mode === 'all' || (mode === 'unknown' && unknown(kj));
    return show ? `<ruby>${kj}<rt>${rd}</rt></ruby>` : kj;
  });
  // What the word looks like on the page (for the tap-to-see panel)
  const shown = hidden ? body.replace(/([一-龯々〆ヶ]+)\[([^\]]+)\]/g, (all, kj, rd) => mode === 'kana' && unknown(kj) ? rd : kj) : surface;

    || (VOCAB_IDS.map(id => CARDS[id]).find(c => c.kana === reading)?.meaning) || AUTO_VOCAB.find(v => v.jp === reading)?.en

// Which grammar points a sentence uses (for the links under a checked copybook line)
function sentenceGrammar(tokens){
  const w = tokens.map(t => t.jp), has = x => w.includes(x), out = [];
  if (has('は') && w.some(x => x.endsWith('です'))) out.push('wa-desu');
  if (w[w.length - 1] === 'か') out.push('ka');
  if (has('の')) out.push('no');
  if (has('も')) out.push('mo');
  if (w.some(x => /^(これ|それ|あれ|どれ|この|その|あの|どの|ここ|そこ|あそこ|どこ)$/.test(x))) out.push('kosoado');
  if (has('じゃ') || w.some(x => x.endsWith('ません'))) out.push(w.some(x => x.endsWith('ません')) && !has('じゃ') ? 'masu-forms' : 'janai');
  if (w.some(x => /でした$/.test(x)) && !w.some(x => /ました$/.test(x))) out.push('deshita');
  if (has('を')) out.push('o-masu');
  if (w.some(x => /ました$/.test(x))) out.push('masu-forms');
  if (has('に')) out.push('ni');
  if (has('へ')) out.push('e');
  if (has('で')) out.push('de');
  if (has('と')) out.push('to');
  if (has('が') && w.some(x => /^(すき|きらい|じょうず|へた)$/.test(x))) out.push('ga-suki');
  if (w.some(x => /^(あります|います)$/.test(x))) out.push('aru-iru');
  if (w.some(x => /たい$/.test(x))) out.push('tai');
  if (w.some(x => /ましょう$|ませんか$/.test(x))) out.push('mashou');
  return [...new Set(out)].filter(id => GRAMMAR.some(g => g.id === id));
}

/* ---------- long-term retention checks: what's still there 1, 3 and 7 days after learning ----------
   Every kana, word and vocab item you learn in a lesson is quizzed again on day 1, 3 and 7.
   This only measures memory; it never changes flashcard scheduling. A check stays open a
   few extra days (day 1: until day 2, day 3: until day 5, day 7: until day 10), then lapses. */
const RET_DAYS = [1, 3, 7], RET_WINDOW = {1:1, 3:2, 7:3}, RET_SAMPLE = 1 / 3;
let RQ = null;
function retentionDue(){
  const t = dayNum(), out = [];
  for (const [id, r] of Object.entries(DB.ret || {})){
    if (!CARDS[id] || !cardOn(id)) continue;
    const age = t - r.l;
    const k = RET_DAYS.find(k => r.c[k] === undefined && age >= k && age <= k + RET_WINDOW[k]);
    if (k) out.push({id, k});
  }
  return out;
}
function startRetention(){
  const qs = shuffle(retentionDue());
  if (!qs.length) return;

  S = null; L = null; D = null; view = 'retention'; render(); window.scrollTo(0, 0); focusRet();
}

  }
  const date = new Date().toLocaleDateString(undefined, {month:'short', day:'numeric'});

  // The stamp lands once per page; later redraws (sync, marking typos) show it still, unless the grade changed

    : P.ans === 'listen' ? `<span class="hint">Each word plays when you reach its box · Space on an empty box plays it again · Enter on the last word checks the page</span><button class="btn primary" data-act="cb-check">Check my page</button>`
    : `<span class="hint">Space or Enter moves to the next word${cbIsEnglish() ? ' (no spaces needed: nicetomeetyou works)' : ''} · Enter on the last word checks the page</span><button class="btn primary" data-act="cb-check">Check my page</button>`;
  return `${head}<div class="cb-layout"><div class="cb-wrap"><div class="paper">

      <div class="paper-head"><h2>練習帳<small>Copybook${P.retry ? ' · retry' : ''}</small></h2><div class="paper-fields"><div class="field">Date <b>${date}</b></div><div class="field" data-tip="Active time on this page — pauses when you stop typing">Time <b id="cbClock" class="cb-clock${P.checked ? ' done' : ''}">${fmtClock(P.secs || 0)}</b></div>${cbTimes().avg ? `<div class="field" data-tip="Your average time per page, all devices">Avg <b>${fmtClock(cbTimes().avg)}</b></div>` : ''}</div></div>
      ${P.lines.map(cbLineHTML).join('')}
      ${P.checked ? cbDoneNote(score, all.length) : ''}
    </div>
    <div class="paper-foot">${foot}</div>

}

/* ---------- lookalike drill ---------- */
function drillPool(){
  const seen = id => CARDS[id] && st(id).s !== 'new' && cardOn(id);
  const sets = new Map();
  for (const g of LOOKALIKES){
    const ids = g.map(kanaCardId).filter(seen);
    if (ids.length >= 2) sets.set(ids.slice().sort().join(), {ids, w:1});
  }
  for (const g of KANJI_LOOKS){
    const ids = g.map(k => 'kj:' + k).filter(seen);
    if (ids.length >= 2) sets.set(ids.slice().sort().join(), {ids, w:1});
  }
  for (const [a, m] of Object.entries(DB.conf)) for (const [b, n] of Object.entries(m)){
    if (!seen(a) || !seen(b)) continue;
    const ids = [a, b].sort(), key = ids.join(), p = sets.get(key) || {ids, w:0};
    p.w += n * 3; sets.set(key, p);
  }
  for (const p of sets.values()) if (p.ids.some(isLeech)) p.w += 3;
  return [...sets.values()];
}
function startDrill(){
  const pool = drillPool();
  if (!pool.length) return;
  const total = sum(pool.map(p => p.w)), qs = [];
  const seenSame = script => (script === 'kj' ? KANJI_IDS : KANA_IDS).filter(id => CARDS[id].script === script && st(id).s !== 'new' && cardOn(id));
  for (let i = 0; i < 15; i++){
    let r = Math.random() * total, set = pool[0];
    for (const p of pool){ r -= p.w; if (r <= 0){ set = p; break; } }
    const target = set.ids[Math.floor(Math.random() * set.ids.length)];
    const opts = [...set.ids];
    const extra = shuffle(seenSame(CARDS[target].script));
    for (const x of extra){
      if (opts.length >= 4 || (opts.length >= 3 && set.ids.length >= 3)) break;
      if (!opts.some(o => CARDS[o].romaji === CARDS[x].romaji)) opts.push(x);
    }
    qs.push({target, opts:shuffle(opts.filter((o, j, a) => a.findIndex(y => CARDS[y].romaji === CARDS[o].romaji) === j))});
  }
  D = {qs, i:0, score:0, picked:null, misses:[]};
  view = 'drill'; render();
}
function drillHTML(){
  if (D.i >= D.qs.length){
    const pct = Math.round(D.score / D.qs.length * 100);
    return `<div class="done">
      <span class="hanko" style="width:64px;height:64px;font-size:30px;margin:0 auto;border-radius:14px">${pct >= 80 ? '良' : '練'}</span>
      <h1>${D.score} / ${D.qs.length}</h1>
      <p class="rom">${pct >= 80 ? 'Sharp eyes! Those lookalikes don’t fool you.' : 'Keep at it — these are the trickiest shapes there are.'}</p>
      ${D.misses.length ? `<div class="panel" style="text-align:left;margin-bottom:22px"><h2>Mixed up this round</h2><div class="trouble" style="margin-top:10px">${[...new Set(D.misses)].map(id => `<button class="chip s-learn" data-act="detail" data-id="${id}">${CARDS[id].kana}</button>`).join('')}</div></div>` : ''}
      <div class="hero-row" style="justify-content:center"><button class="btn primary big" data-act="drill">Drill again</button><button class="btn big" data-act="go" data-view="home">Home</button></div>
    </div>`;
  }
  const q = D.qs[D.i], c = CARDS[q.target];
  const answered = D.picked !== null;
  const opts = q.opts.map((id, i) => {
    let cls = '';
    if (answered){ if (id === q.target) cls = 'right'; else if (id === D.picked) cls = 'wrong'; else cls = 'dim'; }
    return `<button class="opt ${cls}${c.kind === 'kanji' ? ' mean' : ''}" data-act="drill-pick" data-id="${id}" ${answered ? 'disabled' : ''}>${esc(CARDS[id].romaji)}<small>${i + 1}</small></button>`;
  }).join('');
  let feedback = '';
  if (answered && D.picked !== q.target){
    const p = CARDS[D.picked], pk = p.kana;
    feedback = `<div class="compare">
      <div class="panel ok"><div class="lbl">This is ${esc(c.romaji)}</div><div class="kana">${c.kana}</div>${sayBtn(c.kana, true)}</div>
      <div class="panel no"><div class="lbl">You picked ${esc(p.romaji)}</div><div class="kana">${pk}</div>${sayBtn(pk, true)}</div>
    </div>${NOTES[c.id] ? `<div class="box note" style="margin-top:12px">${NOTES[c.id]}</div>` : ''}
    <div class="feedback" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="drill-typo" data-tip="You knew it — the point is yours and it won’t count as a mix-up">👆 I misclicked</button><button class="btn primary" data-act="drill-next">Didn’t know — next →</button></div>`;
  }
  return `<div class="study">
    <div class="study-top">
      <button class="icon-btn" data-act="go" data-view="home" aria-label="End drill">${ICON.close}</button>
      <div class="progress"><span style="width:${D.i / D.qs.length * 100}%"></span></div>
      <div class="counts"><span class="c-rev">${D.score}</span><span class="muted">/ ${D.qs.length}</span></div>
    </div>
    <div class="card-wrap" ${answered ? 'style="animation:none"' : ''}><div class="face solo">
      <div class="face-top"><span class="pill">Lookalike drill · ${SCRIPT_NAME[c.script]}</span></div>
      <div class="front-kana kana${c.kana.length > 1 ? ' combo' : ''}">${c.kana}</div>
      ${askHTML(askFor(c))}
    </div></div>
    <div class="opts">${opts}</div>
    ${feedback}
  </div>`;
}
function drillPick(id){
  if (!D || D.picked !== null) return;
  const q = D.qs[D.i];
  D.picked = id;
  if (id === q.target){
    D.score++; render(); speak(CARDS[q.target].kana);
    setTimeout(() => { if (D && D.qs[D.i] === q){ D.i++; D.picked = null; render(); } }, 650);
  } else {
    logConfusion(q.target, id); recordMistake('drill', 'know'); save();
    D.misses.push(q.target); render();
  }
}

// "I misclicked": give the point back and undo the mix-up it logged
function drillTypo(){
  if (!D || D.picked === null) return;
  const q = D.qs[D.i];
  if (D.picked === q.target) return;
  unlogConfusion(q.target, D.picked);
  const i = D.misses.lastIndexOf(q.target);
  if (i >= 0) D.misses.splice(i, 1);
  D.score++;
  reclassify('drill', 'know', 'typo');
  save();
  D.i++; D.picked = null; render();
}

/* ---------- Cold Learn: every kana you've learned, one at a time in random order, with no hints ---------- */
// Your review schedule is never touched. Mix-ups still feed the lookalike drill, and misses count in Stats.
let CL = null, clScript = 'h', clAll = false;
const clKey = (sc, all) => sc + (all ? '+' : '');
const clPool = (sc, all) => KANA_IDS.filter(id => CARDS[id].script === sc && (all || CARDS[id].kind === 'basic') && st(id).s !== 'new' && cardOn(id));
// The test on offer: the basic kana you've learned, or everything you've learned in that alphabet
function clScope(){
  const sc = clPool(clScript, true).length ? clScript : 'h';
  const basic = clPool(sc, false), every = clPool(sc, true);
  const all = !basic.length || (clAll && every.length > basic.length);
  return {sc, all, ids:all ? every : basic, basicN:basic.length, allN:every.length};
}
const clOk = r => r.ok || r.kind === 'typo';
const clCls = r => !clOk(r) ? 's-learn' : r.slow ? 's-young' : 's-master';
// Last run and best run per test. A bigger test (you've learned more kana since) replaces the best;
// at the same size, more right wins, then faster.
const clBetter = (a, b) => !b || (a.t !== b.t ? a.t > b.t : a.s !== b.s ? a.s > b.s : a.secs < b.secs);
const clBest = r => r && isNum(r.bt) ? {s:r.bs, t:r.bt, secs:r.bsecs} : null;
function clRecord(prev, run){
  const best = clBetter(run, clBest(prev)) ? run : clBest(prev);
  return {s:run.s, t:run.t, secs:run.secs, at:run.at, bs:best.s, bt:best.t, bsecs:best.secs};
}
function openCold(sc){
  if (sc) clScript = sc;
  CL = {phase:'intro', from:view === 'chart' ? 'chart' : 'home'};
  S = null; D = null; L = null; RQ = null;
  view = 'cold'; render(); window.scrollTo(0, 0);
}
function startCold(){
  const {sc, all, ids} = clScope();
  if (!ids.length) return;
  const key = clKey(sc, all);
  CL = {phase:'test', from:CL?.from || 'home', sc, all, key, ids:shuffle(ids), i:0, res:[], prev:DB.cold[key] || null, shownAt:performance.now(), firstKey:null};
  view = 'cold'; render(); window.scrollTo(0, 0);
  document.getElementById('cltyped')?.focus();
}
function clQuit(){ const back = CL?.from || 'home'; CL = null; view = back; render(); window.scrollTo(0, 0); }
const clSecs = () => sum(CL.res.map(r => r.ms)) / 1000 + (CL.phase === 'test' ? (performance.now() - CL.shownAt) / 1000 : 0);
const clScoreHTML = () => { const ok = CL.res.filter(clOk).length; return `<span class="c-rev">✓ ${ok}</span>${CL.res.length - ok ? ` <span class="c-learn">✗ ${CL.res.length - ok}</span>` : ''}`; };
function clSlotHTML(i){
  const r = CL.res[i];
  if (!r) return `<i class="cl-slot${i === CL.i ? ' cur' : ''}"></i>`;
  const c = CARDS[r.id];
  return `<i class="cl-slot ${clCls(r)}" data-tip="${c.romaji}${r.ok ? ` · ${fmtSecs(r.rt)}` : ` · you typed ${r.text ? esc(r.text) : 'nothing'}`}">${c.kana}</i>`;
}
function clLastHTML(){
  const r = CL.res[CL.res.length - 1];
  if (!r) return '<span class="muted">Type what each kana says.</span>';
  const c = CARDS[r.id];
  return r.ok ? `<span class="chipt${r.slow ? ' slow' : ''}">✓ ${c.kana} ${c.romaji}${r.slow ? ` · ${fmtSecs(r.rt)}, a bit slow` : ''}</span>`
    : `<span class="chipt no">✗ ${c.kana} is ${c.romaji}${r.text ? ` — you typed “${esc(r.text)}”` : ''}</span>`;
}
function clSubmit(raw, skip){
  if (!CL || CL.phase !== 'test') return;
  const id = CL.ids[CL.i], c = CARDS[id], now = performance.now(), text = answerText(c, raw);
  if (!text && !skip && now - CL.shownAt < 400) return;      // a double Enter mustn't skip the next kana
  const ok = isCorrect(c, text), rt = ((CL.firstKey ?? now) - CL.shownAt) / 1000;
  CL.res.push({id, text, ok, kind:'know', rt, ms:Math.min(60000, now - CL.shownAt), slow:ok && +DB.settings.speed > 0 && rt > speedTarget(c), hint:!ok && answerTypo(c, text)});
  if (!ok){
    logConfusionFromTyping(id, text); recordMistake('cold', 'know'); save();
    if (DB.settings.autoplay !== false) speak(c.kana);
  }
  CL.i++; CL.shownAt = performance.now(); CL.firstKey = null;
  if (CL.i >= CL.ids.length) return clFinish();
  announce(`${ok ? 'Right' : `No, ${c.romaji}`}. Next: ${CARDS[CL.ids[CL.i]].kana}`);
  clUpdate();
}
// Between kana only the parts that change are redrawn, so the answer box (and a phone's keyboard) stays put
function clUpdate(){
  const $ = id => document.getElementById(id), k = $('clKana'), c = CARDS[CL.ids[CL.i]];
  if (!k) return render();
  k.textContent = c.kana; k.classList.toggle('combo', c.kana.length > 1);
  k.classList.remove('pop'); void k.offsetWidth; k.classList.add('pop');
  $('clCount').textContent = CL.i + 1;
  $('clBar').style.width = CL.i / CL.ids.length * 100 + '%';
  $('clScore').innerHTML = clScoreHTML();
  $('clLast').innerHTML = clLastHTML();
  const slots = document.querySelectorAll('.cl-slot');
  slots[CL.i]?.classList.add('cur');
  if (slots[CL.i - 1]) slots[CL.i - 1].outerHTML = clSlotHTML(CL.i - 1);
  $('cltyped').value = '';
}
function clFinish(){
  CL.phase = 'done'; CL.secs = Math.max(1, Math.round(sum(CL.res.map(r => r.ms)) / 1000)); CL.at = Date.now();
  clSave(); render(); window.scrollTo(0, 0);
  announce(`Done: ${CL.res.filter(clOk).length} of ${CL.ids.length} right`);
}
function clSave(){
  DB.cold[CL.key] = clRecord(CL.prev, {s:CL.res.filter(clOk).length, t:CL.ids.length, secs:CL.secs, at:CL.at});
  save();
}
// "It was a typo": only for an answer one letter off a reading (and not another kana's)
function clTypo(i, kind){
  const r = CL?.res[i];
  if (!r || r.ok || r.kind === kind || (kind === 'typo' && !canForgive(CARDS[r.id], r))) return;
  reclassify('cold', r.kind, kind); r.kind = kind;
  clSave(); render();
}

      ${basicN && allN > basicN ? `<div class="seg"><button data-act="cl-set" data-all="0" class="${all ? '' : 'on'}">Basic · ${basicN}</button><button data-act="cl-set" data-all="1" class="${all ? 'on' : ''}">Everything · ${allN}</button></div>` : ''}

      <div class="panel stat"><div class="k">Best</div><div class="v">${best ? `${best.s}<small>/${best.t}</small>` : '–'}</div>${best ? `<div class="muted" style="font-size:12px">${fmtClock(best.secs)}</div>` : ''}</div>
    </div>
    <div class="hero-row" style="justify-content:center"><button class="btn primary big" data-act="cl-start">Start →</button><button class="btn big ghost" data-act="cl-quit">Back</button></div>
    <p class="muted" style="font-size:12.5px;margin-top:16px">Your reviews aren’t affected. Kana you mix up go to the lookalike drill.</p>

// The results laid out like the kana chart, so a weak row stands out

/* ---------- mastery: how far a card is from a 21-day interval ---------- */
const MASTER_IVL = 21;
// Assuming every answer from here is "Good": how many reviews and roughly how many days until Mastered
function masteryPath(id){
  const c = st(id), today = dayNum();
  if (c.s === 'new') return null;
  if (c.s !== 'review') return {learning:true};
  if (c.ivl >= MASTER_IVL) return {done:true};
  let ivl = c.ivl, days = Math.max(0, c.dueDay - today), n = 0;
  while (n < 12){
    n++;
    ivl = Math.max(ivl + 2, Math.round(ivl * (c.ease || 2.5)));
    if (ivl >= MASTER_IVL) break;
    days += ivl;
  }
  return {n, days};
}
function masteryHTML(id){
  const p = masteryPath(id), c = st(id);
  if (!p) return '';
  const pct = p.done ? 100 : p.learning ? 4 : Math.min(96, c.ivl / MASTER_IVL * 100);
  const text = p.done ? 'Mastered ✓ — keep reviewing to keep it that way.'
    : p.learning ? 'Still in its first steps. Once it graduates, about 4–5 good reviews over a few weeks make it mastered.'
    : `About ${p.n} more good review${p.n === 1 ? '' : 's'} to mastered — roughly ${p.days < 7 ? `${Math.max(1, p.days)} day${p.days === 1 ? '' : 's'}` : `${Math.round(p.days / 7)} week${Math.round(p.days / 7) === 1 ? '' : 's'}`}, if you keep answering it right.`;
  return `<div class="mastery">${meterHTML([[pct, p.done ? 'var(--matcha)' : 'var(--gold)']], 'sm')}<span>${text} <button class="linkbtn" data-act="tips">How mastering works</button></span></div>`;
}
const TIPS_HTML = `<h2>How to master your kana</h2>
  <p>A card counts as <b>Mastered</b> once its review gap reaches <b>${MASTER_IVL} days</b>. Every <b>Good</b> stretches the gap about 2.5×: 1 day → 3 → 7 → 18 → 45. That’s roughly <b>4–5 correct reviews over 3–5 weeks</b> — the waiting is the point: spacing is what moves a kana into long-term memory, so “Young” just means it hasn’t had time yet.</p>
  <ol class="tips">
    <li><b>Review every day.</b> Even five minutes keeps the schedule on track. Skipping days doesn’t break anything; it just slows things down.</li>
    <li><b>Grade honestly.</b> Hesitated? Press <b>Hard</b>. Didn’t know? <b>Again</b>. Saying Good when you weren’t sure sends the card away too long, and then it slips.</li>
    <li><b>Go for instant.</b> Mastery means reading it at a glance. The speed target (Settings) flags slow answers — slow-but-right is a Hard.</li>

  </section>`;
}
function statsHTML(){
  const today = dayNum();
  const allD = allDays(), days = Object.entries(allD).map(([k, v]) => [+k, v]);
  const totalReviews = sum(days.map(([, v]) => v.r || 0));
  const recent = days.filter(([k]) => k > today - 30);
  const rv = sum(recent.map(([, v]) => v.rv || 0)), rc = sum(recent.map(([, v]) => v.rc || 0));
  const retention = rv ? Math.round(rc / rv * 100) + '<small>%</small>' : '—';
  const ms = sum(days.map(([, v]) => v.ms || 0));
  const todayMs = allD[today]?.ms || 0, weekMs = sum(days.filter(([k]) => k > today - 7).map(([, v]) => v.ms || 0));

  // Where the time went. Older days only logged review time (no breakdown), so that remainder is reviews.
  const byAct = Object.fromEntries(Object.keys(ACTIVITIES).map(k => [k, 0]));
  for (const [, v] of days){
    const parts = v.act || {};
    for (const k of Object.keys(byAct)) byAct[k] += parts[k] || 0;
    byAct.review += Math.max(0, Math.round((v.ms || 0) / 1000) - actSecs(v));
  }
  const actMax = Math.max(1, ...Object.values(byAct));
  const breakdown = Object.entries(byAct).sort((a, b) => b[1] - a[1]).map(([k, s]) => `<div class="rank-row">
      <span style="font-size:13px;font-weight:700;min-width:118px">${ACTIVITIES[k]}</span>
      <span><div class="barbg"><span style="width:${s / actMax * 100}%;background:var(--ai)"></span></div></span><b>${fmtHours(s)}</b></div>`).join('');

  // heatmap: 26 weeks, columns = weeks, rows = weekdays (Sun..Sat), shaded by minutes studied in any activity
  const dow = dayDate(today).getUTCDay();
  const start = today - 25*7 - dow;
  let cells = '';
  for (let n = start; n < start + 26*7; n++){
    if (n > today){ cells += '<i class="fut"></i>'; continue; }
    const dd = allD[n], mins = Math.round((dd?.ms || 0) / 60000), r = dd?.r || 0;

/* ---------- transfer codes ---------- */
const b64 = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function makeCode(){
  const bytes = new TextEncoder().encode(JSON.stringify(DB));
  if ('CompressionStream' in window){
    const gz = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    return 'KANA1.' + b64(new Uint8Array(gz));
  }
  return 'KANA0.' + b64(bytes);
}
async function readCode(code){
  // Accepts a bare code or a full link (…#import=CODE); QR links use the URL-safe base64 alphabet
  const m = code.match(/#import=([^\s&]+)/);
  if (m) code = decodeURIComponent(m[1]);
  const [tag, raw = ''] = code.trim().split('.');
  const body = raw.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - raw.length % 4) % 4);
  let bytes = unb64(body);
  if (tag === 'KANA1') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  else if (tag !== 'KANA0') throw new Error('bad code');
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || typeof d.cards !== 'object') throw new Error('bad code');
  return d;
}

/* =========================================================
   Sync across devices through a secret Gist on the user's GitHub account.
   The token and device id live in their own storage key, never inside progress
   data, so they don't travel in text codes or backup files.
   ========================================================= */
var syncReady = false, syncDirty = false, timeDirty = false;
const SYNC_KEY = 'kanamichi.sync', SYNC_FILE = 'kanamichi-progress.json', SYNC_PAGES = 200;
const SYNC_SETTINGS = ['lessons', 'newPerDay', 'newWords', 'newVocab', 'newKanji', 'newKwords', 'furigana', 'spaces', 'lessonSize', 'mode', 'speed', 'cbAnswer', 'autoVocab'];
let SY = (() => { if (SELFTEST) return {}; try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch{ return {}; } })();
SY.dev ||= 'd' + Math.random().toString(36).slice(2, 10);
let syncing = null, syncAgain = false, syncTimer = 0;
function saveSync(){ if (SELFTEST) return; try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); }catch{} }
saveSync();
const syncConnected = () => !!(SY.token && SY.gist);
function deviceName(){
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? 'Android phone' : 'Android tablet';
  if (/Windows/.test(ua)) return 'Windows PC';
  if (/CrOS/.test(ua)) return 'Chromebook';
  if (/Mac/.test(ua)) return 'Mac';
  if (/Linux/.test(ua)) return 'Linux PC';

function markSyncDirty(){
