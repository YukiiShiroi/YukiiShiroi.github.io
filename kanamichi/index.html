<style>
:root{
  --paper:#f6f1e7; --paper-2:#fffcf6; --paper-3:#efe7d8;
  --ink:#231e1a; --ink-2:#4e463f; --muted:#6d655e; --line:#e2d8c7;
  --shu:#c8402b; --shu-2:#f8e1d9;
  --gold:#a8771a; --gold-2:#f6ead0;
  --matcha:#4c7a3b; --matcha-2:#e2eed9;
  --ai:#2e4b80; --ai-2:#dfe6f3;
  --sakura:#eaa5b5;
  --wave:#ddd2bf;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 10px 34px rgba(60,40,20,.09);
  --kana-font:'Klee One',serif;
  --ui-font:'Zen Kaku Gothic New',system-ui,sans-serif;
  --head-font:'Shippori Mincho',serif;
  --on-shu:#fff8f2;
  --radius-panel:20px; --radius-card:26px; --radius-btn:999px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --paper:#14110f; --paper-2:#1c1916; --paper-3:#26211d;
    --ink:#f1e9dc; --ink-2:#cbbfae; --muted:#a0978a; --line:#322b25;
    --shu:#e8644d; --shu-2:#3b201a;
    --gold:#dcab48; --gold-2:#382c14;
    --matcha:#86b56f; --matcha-2:#1f2c19;
    --ai:#86a3e6; --ai-2:#1b2438;
    --sakura:#c97d8f; --wave:#2a2420;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14110f; --paper-2:#1c1916; --paper-3:#26211d;
  --ink:#f1e9dc; --ink-2:#cbbfae; --muted:#a0978a; --line:#322b25;
  --shu:#e8644d; --shu-2:#3b201a;
  --gold:#dcab48; --gold-2:#382c14;
  --matcha:#86b56f; --matcha-2:#1f2c19;
  --ai:#86a3e6; --ai-2:#1b2438;
  --sakura:#c97d8f; --wave:#2a2420;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ui-font); font-size:15px; line-height:1.55;
  min-height:100vh; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--seigaiha); background-size:64px 32px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,transparent 55%);
  mask-image:linear-gradient(to bottom,#000 0,transparent 55%);
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed; opacity:.5}
.jp{font-family:var(--head-font)}
.kana{font-family:var(--kana-font)}
/* Romaji answers: a typeface built so look-alike letters (e/o, a/o, l/I) stay distinct */
.opt, .rom, .r, .unit small, .look b, .typein input, .codebox{font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.muted{color:var(--muted)}

/* ---------- header / nav ---------- */
header{
  position:sticky; top:0; z-index:10; padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1080px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px}
.logo{display:flex; align-items:center; gap:10px; background:none; border:0; padding:0}
.hanko{
  width:34px; height:34px; border-radius:8px; background:var(--shu); color:#fff6ee;
  display:grid; place-items:center; font-family:var(--head-font); font-weight:800; font-size:20px;
  transform:rotate(-4deg); box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); flex:none;
}
.logo b{font-family:var(--head-font); font-size:19px; letter-spacing:.02em}
.logo small{color:var(--muted); font-size:12px; margin-left:2px}
nav{margin-left:auto; display:flex; gap:2px}
nav button{background:none; border:0; padding:8px 12px; border-radius:999px; color:var(--ink-2); font-weight:500}
nav button svg{display:none}
nav button:hover{background:var(--paper-3)}
nav button.on{background:var(--ink); color:var(--paper)}
.icon-btn{background:none; border:1px solid var(--line); width:36px; height:36px; border-radius:999px; display:grid; place-items:center; color:var(--ink-2); flex:none}
.icon-btn:hover{background:var(--paper-3)}

main{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:28px 16px 64px}

/* ---------- common ---------- */
.panel{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius-panel); padding:22px; box-shadow:var(--shadow)}
.panel h2{font-family:var(--head-font); font-size:19px; margin:0 0 4px}
.panel .sub{color:var(--muted); font-size:13px; margin:0 0 16px}
.btn{border:1px solid var(--line); background:var(--paper-2); padding:10px 18px; border-radius:var(--radius-btn); font-weight:700; transition:transform .12s,background .2s,box-shadow .2s}
.btn:hover{background:var(--paper-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--shu); border-color:var(--shu); color:var(--on-shu); box-shadow:0 6px 18px color-mix(in srgb,var(--shu) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.06); background:var(--shu)}
.btn.big{padding:14px 26px; font-size:16px}
.btn.sm{padding:7px 14px; font-size:13px}
.btn.ghost{background:transparent}
.linkbtn{background:none; border:0; padding:0; color:var(--ai); font-weight:700; font-size:12px}
.linkbtn:hover{text-decoration:underline}
.eyebrow{font-size:13px; letter-spacing:.08em; color:var(--shu); font-weight:700; margin:0 0 6px}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.page-head h1{font-family:var(--head-font); margin:0; font-size:30px}
.page-head p.sub{margin:4px 0 0; color:var(--muted)}

/* ---------- home ---------- */
.hero{display:grid; grid-template-columns:1.35fr 1fr; gap:22px; align-items:stretch; margin-bottom:22px}
.hero-main{padding:34px}
.hero h1{font-family:var(--head-font); font-size:clamp(30px,4.6vw,46px); line-height:1.15; margin:0 0 12px; font-weight:800}
.hero h1 em{font-style:normal; color:var(--shu)}
.hero .lede{color:var(--ink-2); margin:0 0 24px; max-width:44ch}
.hero .meta{color:var(--muted); font-size:13px; margin-top:12px}
.hero-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.kotd{position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; min-height:250px;
  background:linear-gradient(160deg,var(--paper-2),var(--paper-3))}
.kotd .label{font-size:12px; letter-spacing:.1em; color:var(--muted); font-weight:700; text-transform:uppercase}
.kotd .big{font-size:120px; line-height:1; text-align:center; margin:8px 0}
.kotd .foot{display:flex; justify-content:space-between; align-items:end; gap:10px}
.kotd .rom{font-size:22px; font-weight:700}
.kotd .word{color:var(--ink-2); font-size:13px; text-align:right}
.kotd .sun{position:absolute; width:180px; height:180px; border-radius:50%; background:var(--shu); opacity:.09; right:-50px; top:-50px}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
.stat{padding:18px 20px}
.stat .k{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:6px}
.stat .v{font-size:30px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px; color:var(--muted); font-weight:500}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block}

.practice{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:22px}
.ptile{position:relative; overflow:hidden; text-align:left; display:flex; flex-direction:column; gap:4px; cursor:pointer; transition:transform .15s, box-shadow .2s; color:var(--ink)}
.ptile:hover:not(:disabled){transform:translateY(-2px)}
.ptile .glyph{position:absolute; right:14px; top:6px; font-size:64px; opacity:.13; font-family:var(--head-font); font-weight:800; pointer-events:none}
.ptile b{font-family:var(--head-font); font-size:18px}
.ptile span{color:var(--muted); font-size:13px}
.ptile .go{margin-top:8px; color:var(--shu); font-weight:700; font-size:13px}

.trouble{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

.two{display:grid; grid-template-columns:1.2fr 1fr; gap:22px; margin-bottom:22px}
.forecast{display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:18px}
.fc{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
.fc .b{width:100%; max-width:40px; border-radius:6px 6px 2px 2px; background:var(--ai); opacity:.85; min-height:3px; transition:height .6s cubic-bezier(.2,.8,.2,1)}
.fc:first-child .b{background:var(--shu)}
.fc .n{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums}
.fc .d{font-size:11px; color:var(--muted)}
.rings{display:flex; gap:14px; justify-content:space-around; flex-wrap:wrap; padding-top:6px}
.ring{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
.ring svg{transform:rotate(-90deg)}
.ring .wrap{position:relative; width:96px; height:96px}
.ring .in{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
.ring .in b{font-size:30px; line-height:1}
.ring .t{font-weight:700}
.ring .s{font-size:12px; color:var(--muted)}

.course h3{font-family:var(--head-font); font-size:17px; margin:18px 0 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.course h3 small{font-family:var(--ui-font); color:var(--muted); font-weight:500; font-size:13px}
.lesson{display:grid; grid-template-columns:180px 1fr auto; align-items:center; gap:16px; padding:12px 4px; border-top:1px solid var(--line)}
.lesson .ttl{font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.lesson .cnt{font-size:12px; color:var(--muted)}
.lesson.off .chips{opacity:.45}
.tag{font-size:10px; font-weight:700; letter-spacing:.06em; padding:2px 7px; border-radius:999px; background:var(--shu); color:var(--on-shu); text-transform:uppercase}
.tag.ok{background:var(--matcha)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{min-width:30px; height:30px; padding:0 5px; border-radius:8px; display:grid; place-items:center; font-family:var(--kana-font); font-size:17px; border:1px solid var(--line); background:var(--paper)}
button.chip{cursor:pointer}
.s-learn{background:var(--shu-2); border-color:color-mix(in srgb,var(--shu) 40%,transparent); color:var(--shu)}
.s-young{background:var(--gold-2); border-color:color-mix(in srgb,var(--gold) 40%,transparent); color:var(--gold)}
.s-master{background:var(--matcha-2); border-color:color-mix(in srgb,var(--matcha) 45%,transparent); color:var(--matcha)}
.s-new{color:var(--muted)}

.switch{position:relative; width:44px; height:26px; flex:none}
.switch input{opacity:0; width:0; height:0; position:absolute}
.switch span{position:absolute; inset:0; border-radius:999px; background:var(--paper-3); border:1px solid var(--line); transition:.2s; cursor:pointer}
.switch span::after{content:''; position:absolute; width:20px; height:20px; left:2px; top:2px; border-radius:50%; background:var(--paper-2); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:.2s}
.switch input:checked + span{background:var(--matcha); border-color:var(--matcha)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--ai); outline-offset:2px}

/* ---------- study ---------- */
.study{max-width:560px; margin:0 auto}
.study-top{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.progress{flex:1; height:8px; background:var(--paper-3); border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.progress span{display:block; height:100%; background:linear-gradient(90deg,var(--shu),var(--sakura)); border-radius:999px; transition:width .4s ease}
.counts{display:flex; gap:10px; font-weight:700; font-variant-numeric:tabular-nums; font-size:14px}
.counts span{padding-bottom:1px; border-bottom:2px solid transparent}
.counts .cur{border-bottom-color:currentColor}
.c-new{color:var(--ai)} .c-learn{color:var(--shu)} .c-rev{color:var(--matcha)}

.card-wrap{perspective:1600px; animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
.card{display:grid; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.8,.2,1); cursor:pointer}
.card.flipped{transform:rotateY(180deg); cursor:default}
.face{
  grid-area:1/1; position:relative; backface-visibility:hidden; -webkit-backface-visibility:hidden; container-type:inline-size;
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius-card); box-shadow:var(--shadow);
  padding:26px; min-height:420px; display:flex; flex-direction:column;
}
.face::before{content:''; position:absolute; inset:9px; border:1px solid var(--line); border-radius:calc(var(--radius-card) - 7px); pointer-events:none}
.face.back{transform:rotateY(180deg)}
.face.solo{min-height:300px}
.face-top{display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; gap:8px}
.pill{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--paper-3); color:var(--ink-2)}
.stamp{font-family:var(--head-font); font-weight:800; font-size:13px; color:var(--shu); border:2px solid var(--shu); border-radius:6px; padding:2px 8px; transform:rotate(6deg); letter-spacing:.1em}
.front-kana{flex:1; display:grid; place-items:center; font-size:clamp(130px,36vw,190px); line-height:1; padding:10px 0; white-space:nowrap}
.front-kana.combo{font-size:clamp(100px,28vw,150px)}
.tap{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; color:var(--muted); font-size:13px}
.tap .ask{display:inline-block; font-size:clamp(18px,4.6vw,23px); font-weight:800; line-height:1.25; color:var(--ink); padding:7px 18px; border-radius:999px;
  background:color-mix(in srgb,var(--ai) 13%,var(--paper)); border:1.5px solid color-mix(in srgb,var(--ai) 38%,transparent); letter-spacing:.005em}
.tap small{font-size:12.5px; color:var(--muted)}
.back-head{display:flex; align-items:center; justify-content:center; gap:18px; margin:18px 0 6px; flex-wrap:wrap}
.back-head .kana{font-size:76px; line-height:1}
.back-head .rom{font-size:46px; font-weight:700; letter-spacing:.02em}
.word-head{text-align:center; margin:14px 0 4px}
.word-head .kana{line-height:1.15; white-space:nowrap}
.word-head .rom{font-size:26px; font-weight:700}
.word-head .mean{font-size:18px; color:var(--ink-2)}
.say{border:1px solid var(--line); background:var(--paper); width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2); flex:none}
.say:hover{background:var(--paper-3); color:var(--shu)}
.say.sm{width:30px; height:30px}
.verdicts{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:0 0 8px}
.chipt{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--matcha-2); color:var(--matcha)}
.chipt.no{background:var(--shu-2); color:var(--shu)}
.chipt.slow{background:var(--gold-2); color:var(--gold)}
.parts{text-align:center; color:var(--ink-2); font-size:14px; margin-bottom:8px; display:flex; justify-content:center; flex-wrap:wrap; gap:6px; align-items:center}
.parts .kana{font-size:20px}
.unit{display:inline-flex; flex-direction:column; align-items:center; padding:4px 8px; border-radius:10px; background:var(--paper); border:1px solid var(--line); min-width:40px}
.unit .kana{font-size:22px; line-height:1.2}
.unit small{font-size:11px; color:var(--muted); font-weight:700}
.info{display:flex; flex-direction:column; gap:10px; margin-top:8px; position:relative; z-index:1}
.box{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:14px}
.box .lbl{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.box.note{background:var(--gold-2); border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.box.leech{background:var(--shu-2); border-color:color-mix(in srgb,var(--shu) 35%,transparent)}
.box.leech .lbl{color:var(--shu)}
.box textarea{width:100%; min-height:70px; font:inherit; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); padding:8px 10px; resize:vertical}
.box .edit-row{display:flex; gap:8px; justify-content:flex-end; margin-top:8px}
.wordrow{display:flex; align-items:center; gap:12px}
.wordrow .w{font-family:var(--kana-font); font-size:24px; line-height:1.2}
.wordrow mark{background:none; color:var(--shu); font-weight:600}
.wordrow .m{color:var(--ink-2); font-size:13px}
.twin{display:flex; align-items:center; gap:8px}
.twin .kana{font-size:24px}
.look{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
.look button{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper-2); border-radius:10px; padding:3px 10px}
.look .kana{font-size:22px}

.answer{margin-top:20px; min-height:80px}
.reveal{width:100%; padding:16px; font-size:16px}
.typein{display:flex; gap:10px}
.typein input{flex:1; min-width:0; font:inherit; font-size:18px; padding:13px 18px; border-radius:999px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); outline:none; text-align:center}
.typein input:focus{border-color:var(--ai); box-shadow:0 0 0 4px color-mix(in srgb,var(--ai) 18%,transparent)}
.rate{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.rate button{border-radius:16px; padding:11px 4px 10px; border:1px solid; display:flex; flex-direction:column; align-items:center; gap:1px; transition:transform .12s, box-shadow .2s}
.rate button:active{transform:scale(.96)}
.rate .l{font-weight:700; font-size:15px}
.rate .j{font-size:11px; opacity:.75}
.rate .i{font-size:12px; font-weight:700; opacity:.9; font-variant-numeric:tabular-nums}
.r1{background:var(--shu-2); border-color:color-mix(in srgb,var(--shu) 35%,transparent)!important; color:var(--shu)}
.r2{background:var(--gold-2); border-color:color-mix(in srgb,var(--gold) 35%,transparent)!important; color:var(--gold)}
.r3{background:var(--matcha-2); border-color:color-mix(in srgb,var(--matcha) 35%,transparent)!important; color:var(--matcha)}
.r4{background:var(--ai-2); border-color:color-mix(in srgb,var(--ai) 35%,transparent)!important; color:var(--ai)}
.rate button.sug{box-shadow:0 0 0 3px currentColor}
.keys{text-align:center; color:var(--muted); font-size:12px; margin-top:16px}
kbd{font-family:inherit; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--paper-2)}

/* ---------- drill / quiz ---------- */
.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-top:20px}
.opt{padding:14px 10px 10px; border-radius:16px; border:1.5px solid var(--line); background:var(--paper-2); color:var(--ink); font-size:34px; font-weight:700; line-height:1.1; letter-spacing:.03em; box-shadow:var(--shadow); transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:disabled{opacity:1; cursor:default}
.opt.right{background:var(--matcha-2); color:var(--matcha); border-color:var(--matcha)}
.opt.wrong{background:var(--shu-2); color:var(--shu); border-color:var(--shu)}
.opt.dim{opacity:.55!important}
.opt small{display:block; font-size:11px; opacity:.55; font-weight:400; letter-spacing:0; margin-top:4px}
.compare{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; animation:cardIn .3s}
.compare .panel{text-align:center; padding:14px}
.compare .kana{font-size:84px; line-height:1.15}
.compare .lbl{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.compare .ok .lbl{color:var(--matcha)} .compare .no .lbl{color:var(--shu)}
.feedback{margin-top:14px; display:flex; justify-content:center}

/* ---------- lessons ---------- */
.face.teach{min-height:0}
.teach-hero{display:flex; align-items:center; justify-content:center; gap:24px; margin:14px 0 6px; position:relative; z-index:1}
.teach-hero .kana{font-size:clamp(110px,30vw,150px); line-height:1}
.teach-hero .rom{font-size:46px; font-weight:700; line-height:1}
.teach-hero small{display:block; color:var(--muted); font-size:12px; margin-top:6px}
.fonts{display:flex; justify-content:center; gap:8px; margin:4px 0 8px; position:relative; z-index:1; flex-wrap:wrap}
.fonts span{display:flex; flex-direction:column; align-items:center; padding:6px 12px; border:1px solid var(--line); border-radius:12px; background:var(--paper)}
.fonts b{font-size:30px; font-weight:400; line-height:1.2}
.fonts small{font-size:10px; color:var(--muted); font-weight:700; letter-spacing:.04em}
.slide{position:relative; z-index:1}
.slide h2{font-family:var(--head-font); font-size:30px; margin:4px 0 8px}
.slide p{color:var(--ink-2); margin:0 0 10px}
.slide .chips{gap:8px; margin:16px 0}
.slide .unit{cursor:pointer}
.slide .unit .kana{font-size:30px}
.dots{display:flex; gap:6px; justify-content:center; align-items:center; margin-top:16px; flex-wrap:wrap}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--line); transition:.2s}
.dots i.sm{width:5px; height:5px}
.dots i.past{background:var(--sakura)}
.dots i.on{background:var(--shu); transform:scale(1.3)}
.lesson-nav{display:grid; grid-template-columns:1fr 2fr; gap:10px; margin-top:16px}
.lesson-nav .btn{padding:14px}
.fix{margin-top:14px; animation:cardIn .3s}
.fix .rowx{display:flex; align-items:center; gap:16px}
.fix .kana{font-size:56px; line-height:1}
.fix b.r{font-size:26px}

/* ---------- copybook: soft cream paper by day, dim lamp-lit paper by night ---------- */
:root{
  --pp-bg:#f6f0e1; --pp-ink:#2a2520; --pp-faint:#857a6d; --pp-num:#ab9e88; --pp-line:#e2d7c3; --pp-note:#6f655b; --pp-bad:#a59b90;
  --pp-rule:#9dbbd9; --pp-dash:#c9d6e3; --pp-margin:#e5a29f; --pp-pen:#1f3a8a; --pp-red:#cc3a2e;
  --pp-dot:rgba(120,90,50,.045); --pp-hl:rgba(255,226,110,.30); --pp-sheet:#ede5d2; --pp-sheet2:#e7dec9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --pp-bg:#26221d; --pp-ink:#e6ddcd; --pp-faint:#9a8f80; --pp-num:#7a6f62; --pp-line:#3b342c; --pp-note:#a99e8f; --pp-bad:#81776b;
    --pp-rule:#3f5873; --pp-dash:#2f3f50; --pp-margin:#6e3532; --pp-pen:#a3bcff; --pp-red:#f27a6a;
    --pp-dot:rgba(255,240,220,.022); --pp-hl:rgba(255,215,110,.09); --pp-sheet:#211d19; --pp-sheet2:#1d1a16;
  }
}
:root[data-theme="dark"]{
  --pp-bg:#26221d; --pp-ink:#e6ddcd; --pp-faint:#9a8f80; --pp-num:#7a6f62; --pp-line:#3b342c; --pp-note:#a99e8f; --pp-bad:#81776b;
  --pp-rule:#3f5873; --pp-dash:#2f3f50; --pp-margin:#6e3532; --pp-pen:#a3bcff; --pp-red:#f27a6a;
  --pp-dot:rgba(255,240,220,.022); --pp-hl:rgba(255,215,110,.09); --pp-sheet:#211d19; --pp-sheet2:#1d1a16;
}
.cb-wrap{max-width:860px; margin:0 auto; width:100%; min-width:0}
.cb-layout{display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:28px; align-items:start}
.cb-side{position:sticky; top:84px; display:flex; flex-direction:column; gap:16px; padding:20px}
.cb-side h3{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
.cb-prof{display:flex; align-items:center; gap:16px}
.cb-streak{display:flex; align-items:center; gap:12px; background:var(--gold-2); border:1px solid color-mix(in srgb,var(--gold) 30%,transparent); border-radius:14px; padding:10px 14px}
.cb-streak b{font-size:30px; line-height:1; color:var(--gold); font-variant-numeric:tabular-nums; min-width:24px; text-align:center}
.cb-kv{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.cb-kv div{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:8px 10px}
.cb-kv b{display:block; font-size:20px; font-variant-numeric:tabular-nums}
.cb-kv span{font-size:11px; color:var(--muted)}
.cb-clock{font-variant-numeric:tabular-nums; min-width:46px; display:inline-block}
.cb-clock.paused{color:var(--pp-faint); font-style:italic}
.cb-clock.paused::after{content:' paused'; font-size:11px}
.cb-clock.done{color:var(--pp-faint)}
.cb-week{height:70px; padding-top:8px; gap:6px; margin-top:10px}
.cb-week .b{max-width:24px; border-radius:4px 4px 1px 1px}
.paper-fields{display:flex; gap:16px; flex-wrap:nowrap; align-items:flex-end; align-self:flex-end}
.paper-fields .field{align-items:baseline}
.paper .paper-head{padding-right:124px}
@media (max-width:640px){ .paper-fields{flex-wrap:wrap; gap:4px 12px} .paper .paper-head{padding-right:84px} }
.mk-split{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.mk-split div{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.mk-split b{display:block; font-size:24px; font-variant-numeric:tabular-nums}
.mk-split span{font-size:12px; color:var(--muted)}
.mk-bar{display:flex; gap:2px; background:var(--paper-3)}
.mk-bar span{border-radius:0!important}
@media (max-width:520px){ .mk-split{grid-template-columns:1fr} }
/* mistake marking: typo vs didn't know */
.mk{display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap}
.mk-hint{font-size:11px; font-weight:700; color:var(--gold)}
.mk-b{border:1px solid var(--line); background:var(--paper-2); color:var(--ink-2); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; font-family:var(--ui-font)}
.mk-b.on{background:var(--shu-2); color:var(--shu); border-color:color-mix(in srgb,var(--shu) 45%,transparent)}
.mk-b.on.typo{background:var(--gold-2); color:var(--gold); border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.cb-mks{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:6px}
.cb-mk{display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px 8px; font-size:13px; color:var(--pp-note)}
.cb-mk .kana{font-size:18px; color:var(--pp-ink); white-space:nowrap}
.cb-mk .w{font-family:'Atkinson Hyperlegible',sans-serif; font-weight:700; white-space:nowrap}
.cb-mk .mk-b{background:var(--pp-bg); border-color:var(--pp-line); color:var(--pp-note)}
.cb-wr.typo .cb-fix{color:var(--gold)}
.cb-wr.typo .cb-fix small{font-size:10px; font-weight:400; opacity:.85}
.cb-wr.typo .cb-in.bad{text-decoration-color:var(--gold)}
/* compact proficiency panel */
.cb-side{gap:12px; padding:16px}
.cb-side .ring .wrap{width:64px; height:64px}
.cb-side .cb-prof{gap:12px}
.cb-side .cb-streak{display:inline-flex; gap:5px; align-items:baseline; background:none; border:0; padding:0; margin-top:3px; font-size:12px; font-weight:700}
.cb-side .cb-streak b{font-size:15px; min-width:0}
.seg.sm{display:flex; width:100%}
.seg.sm button{flex:1; padding:5px 6px; font-size:12px}
.cb-tabbody{display:flex; flex-direction:column; gap:12px; min-height:120px}
.cb-kv b{font-size:17px}
.cb-kv div{padding:6px 9px}
.cb-kv.three{grid-template-columns:repeat(3,1fr)}
.cb-kv.three b{font-size:15px}
.cb-week{height:56px; margin-top:0}
.cb-pages{display:flex; flex-direction:column; gap:7px}
.cb-more{margin-top:8px}
.cb-more summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ai); padding:4px 0; user-select:none}
.cb-more summary::-webkit-details-marker{display:none}
.cb-more summary::before{content:'▸'; transition:transform .2s; display:inline-block}
.cb-more[open] summary::before{transform:rotate(90deg)}
.cb-more .less, .cb-more[open] .more{display:none}
.cb-more[open] .less{display:inline}
.cb-scroll{max-height:96px; overflow-y:auto; padding:6px 6px 6px 0; margin-top:4px; border-top:1px dashed var(--line); scrollbar-width:thin}
.cb-page{display:grid; grid-template-columns:34px 40px 1fr 44px; gap:8px; align-items:center; font-size:12px; font-variant-numeric:tabular-nums}
.cb-page .n{color:var(--muted)}
.cb-page .sc{font-weight:700}
.cb-page .tm{text-align:right; font-weight:700}
.cb-page .tm.quick{color:var(--matcha)}
.cb-page .tm.slow{color:var(--gold)}
.cb-done-note{position:relative; margin:14px 0 0; padding-top:10px; border-top:1px dashed var(--pp-line); font-family:'Klee One',serif; font-size:17px; color:var(--pp-red); display:flex; gap:6px 16px; flex-wrap:wrap; align-items:baseline}
.cb-done-note small{font-size:13px; color:var(--pp-note)}
.cb-bars{display:flex; align-items:flex-end; gap:4px; height:60px; border-bottom:1px solid var(--line)}
.cb-bars i{flex:1; max-width:22px; border-radius:4px 4px 1px 1px}
@media (max-width:1020px){
  .cb-layout{grid-template-columns:1fr}
  .cb-side{position:static; max-width:860px; width:100%; margin:0 auto}
}
.paper{
  position:relative; color:var(--pp-ink); background-color:var(--pp-bg); border-radius:3px 10px 10px 3px;
  padding:28px 28px 30px 86px;
  background-image:radial-gradient(var(--pp-dot) 1px, transparent 1.3px); background-size:7px 7px;
  box-shadow:0 1px 1px rgba(0,0,0,.08), 4px 4px 0 -1px var(--pp-sheet), 4px 4px 0 0 rgba(0,0,0,.07), 8px 8px 0 -1px var(--pp-sheet2), 8px 8px 0 0 rgba(0,0,0,.06), 0 22px 44px rgba(50,30,10,.22);
}
.paper::before{content:''; position:absolute; top:0; bottom:0; left:68px; width:2px; background:var(--pp-margin)}
.hole{position:absolute; left:9px; width:17px; height:17px; border-radius:50%; background:var(--paper); box-shadow:inset 0 2px 3px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.6)}
.paper-head{display:flex; justify-content:space-between; align-items:flex-end; gap:10px 20px; flex-wrap:wrap; border-bottom:2px solid var(--pp-rule); padding-bottom:8px; margin-bottom:6px; padding-right:110px}
.paper-head h2{font-family:var(--head-font); font-size:24px; margin:0; color:var(--pp-ink); font-weight:800}
.paper-head h2 small{font-family:var(--ui-font); font-size:13px; color:var(--pp-faint); font-weight:500; margin-left:8px}
.paper-head .field{font-size:12px; color:var(--pp-faint); display:flex; gap:6px; align-items:baseline}
.paper-head .field b{font-family:'Klee One',serif; font-size:16px; color:var(--pp-pen); border-bottom:1px solid var(--pp-line); padding:0 10px; font-weight:600}
.cb-line{position:relative; padding:4px 0 10px}
.cb-num{position:absolute; left:-52px; top:66px; width:30px; height:30px; display:grid; place-items:center; font-family:'Klee One',serif; color:var(--pp-num); font-size:17px; border-radius:50%}
.cb-num.ok{border:2.5px solid var(--pp-red); color:var(--pp-red); transform:rotate(-8deg)}
.cb-num.miss{color:var(--pp-red)}
.cb-row{display:flex; flex-wrap:wrap; align-items:flex-end}
.cb-col{display:flex; flex-direction:column; padding-right:22px; flex:none}
.cb-col.fill{flex:1 1 24px; padding-right:0}
.cb-jp{background:none; border:0; border-bottom:1px solid var(--pp-line); height:60px; padding:0 0 4px; display:flex; align-items:flex-end; font-size:33px; line-height:1.1; color:var(--pp-ink); cursor:pointer; white-space:nowrap; font-family:var(--kana-font)}
.cb-jp:hover{color:#c8402b}
.cb-jp.ear{color:var(--pp-note); padding-bottom:10px}
.cb-jp.ear svg{width:26px; height:26px}
.cb-col:focus-within .cb-jp.ear{color:#c8402b}
.cb-jp.ro{font-family:'Atkinson Hyperlegible',sans-serif; font-size:26px; font-weight:700; letter-spacing:.02em}
.cb-in.en{font-size:20px}
.cb-segs{display:flex; flex-direction:column; align-items:flex-end; gap:8px}
@media (max-width:640px){ .cb-segs{align-items:stretch} .cb-segs .seg{justify-content:center} }
.cb-col.fill .cb-jp{cursor:default}
.cb-wr{position:relative; height:56px; border-bottom:2px solid var(--pp-rule);
  background-image:linear-gradient(to right,var(--pp-dash) 55%,transparent 0); background-size:9px 1px; background-repeat:repeat-x; background-position:0 27px}
.cb-wr:focus-within{background-color:var(--pp-hl)}
.cb-in{position:absolute; inset:0; width:100%; border:0; background:transparent; outline:none; padding:22px 2px 0; font-family:'Atkinson Hyperlegible',system-ui,sans-serif; font-size:24px; font-weight:700; color:var(--pp-pen); caret-color:#c8402b}
.cb-in:disabled{opacity:1; -webkit-text-fill-color:currentColor}
.cb-in.bad{color:var(--pp-bad); text-decoration:line-through 2px var(--pp-red)}
.cb-fix{position:absolute; top:0; left:2px; font-family:'Atkinson Hyperlegible',sans-serif; font-weight:700; font-size:16px; color:var(--pp-red); transform:rotate(-2deg); white-space:nowrap}
.cb-ok{position:absolute; top:2px; right:-16px; width:15px; height:15px; border:2px solid var(--pp-red); border-radius:50%}
.cb-note{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; font-family:'Klee One',serif; font-size:15px; color:var(--pp-note)}
.cb-note .say{background:var(--pp-bg); border-color:var(--pp-line); color:var(--pp-note)}
.cb-note .cb-tip{color:var(--pp-red)}
.stampx{position:absolute; top:16px; right:22px; width:98px; height:98px; border:3px solid var(--pp-red); border-radius:50%; color:var(--pp-red); display:grid; place-items:center; text-align:center;
  font-family:var(--head-font); font-weight:800; font-size:17px; line-height:1.15; transform:rotate(-12deg); opacity:.9; box-shadow:inset 0 0 0 4px var(--pp-bg), inset 0 0 0 5.5px var(--pp-red); animation:stampIn .4s cubic-bezier(.2,1.5,.4,1)}
.stampx.still{animation:none}
@keyframes stampIn{from{transform:rotate(-12deg) scale(1.9); opacity:0} to{transform:rotate(-12deg) scale(1); opacity:.9}}
.paper-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:22px; flex-wrap:wrap}
.paper-foot .hint{color:var(--muted); font-size:13px}
.paper-foot .score{font-family:'Klee One',serif; font-size:20px; color:var(--shu); font-weight:600}
@media (max-width:640px){
  .paper{padding:22px 16px 24px 52px}
  .paper::before{left:42px}
  .hole{display:none}
  .paper-head{padding-right:84px}
  .cb-num{left:-46px; width:26px; height:26px; font-size:14px; top:62px}
  .cb-jp{font-size:28px; height:54px}
  .cb-col{padding-right:16px}
  .stampx{width:78px; height:78px; font-size:14px; right:10px; top:10px}
}

/* ---------- done ---------- */
.done{text-align:center; max-width:600px; margin:30px auto 0; position:relative}
.done h1{font-family:var(--head-font); font-size:40px; margin:10px 0 4px}
.done .rom{color:var(--muted); margin:0 0 26px}
.done .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:26px}
.done .grid .stat{padding:14px 8px}
.done .grid .v{font-size:24px}
.petals{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5}
.petal{position:absolute; top:-30px; width:14px; height:11px; background:var(--sakura); border-radius:100% 0 100% 0; opacity:.85; animation:fall linear forwards}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(40px,55vh) rotate(200deg)}
  100%{transform:translate(-20px,110vh) rotate(400deg); opacity:.2}
}

/* ---------- chart ---------- */
.seg{display:inline-flex; background:var(--paper-3); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:7px 14px; border-radius:999px; font-weight:500; color:var(--ink-2)}
.seg button.on{background:var(--paper-2); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); font-weight:700}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:4px; border:1px solid var(--line)}
.charts{display:grid; grid-template-columns:1.25fr 1fr; gap:22px; align-items:start}
.grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.cell{aspect-ratio:1/1; border-radius:14px; border:1px solid var(--line); background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; transition:transform .12s; min-width:0}
.cell:hover{transform:translateY(-2px)}
.cell .kana{font-size:clamp(22px,4vw,34px); line-height:1.1}
.grid3 .cell{aspect-ratio:auto; padding:10px 4px}
.cell .r{font-size:11px; opacity:.8; font-weight:700}
.cell.blank{visibility:hidden}
.side-stack{display:flex; flex-direction:column; gap:22px}

/* ---------- modal & tooltip ---------- */
.modal{position:fixed; inset:0; background:rgba(20,15,10,.45); display:grid; place-items:center; z-index:40; padding:16px; animation:fade .2s}
.sheet{background:var(--paper-2); border:1px solid var(--line); border-radius:24px; width:min(480px,100%); max-height:88vh; overflow:auto; padding:22px; box-shadow:var(--shadow); animation:cardIn .25s}
.sheet .big{font-size:110px; line-height:1.1; text-align:center}
.kv{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0}
.kv div{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:8px; text-align:center}
.kv b{display:block; font-size:16px}
.kv span{font-size:11px; color:var(--muted)}
.tip{position:fixed; z-index:60; pointer-events:none; background:var(--ink); color:var(--paper); font-size:12px; padding:5px 9px; border-radius:8px; opacity:0; transition:opacity .12s; white-space:nowrap}

/* ---------- stats ---------- */
.heat-wrap{display:grid; grid-template-columns:auto 1fr; gap:6px; max-width:640px}
.heat-days{display:grid; grid-template-rows:repeat(7,1fr); gap:3px; font-size:10px; color:var(--muted); align-items:center}
.heat{display:grid; grid-template-columns:repeat(26,1fr); grid-template-rows:repeat(7,1fr); grid-auto-flow:column; gap:3px}
.heat i{aspect-ratio:1/1; border-radius:3px; background:var(--paper-3)}
.heat i.l1{background:color-mix(in srgb,var(--matcha) 28%,var(--paper-2))}
.heat i.l2{background:color-mix(in srgb,var(--matcha) 50%,var(--paper-2))}
.heat i.l3{background:color-mix(in srgb,var(--matcha) 75%,var(--paper-2))}
.heat i.l4{background:var(--matcha)}
.heat i.fut{visibility:hidden}
.heat i.today{outline:1.5px solid var(--ink-2); outline-offset:1px}
.heat-legend{display:flex; gap:4px; align-items:center; justify-content:flex-end; font-size:11px; color:var(--muted); margin-top:10px}
.heat-legend i{width:11px; height:11px; border-radius:3px; display:inline-block}
.three{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:22px}
.rank{display:flex; flex-direction:column; gap:8px}
.rank-row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:13px; background:none; border:0; padding:0; text-align:left; width:100%}
.rank-row .barbg{height:6px; border-radius:999px; background:var(--paper-3); overflow:hidden}
.rank-row .barbg span{display:block; height:100%; border-radius:999px; background:var(--shu)}
.rank-row b{font-variant-numeric:tabular-nums}
.empty{color:var(--muted); font-size:13px; padding:8px 0}

/* ---------- guides ---------- */
.guide-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px}
.gcard{text-align:left; display:flex; flex-direction:column; gap:6px; cursor:pointer; position:relative; overflow:hidden; color:var(--ink); transition:transform .15s}
.gcard:hover{transform:translateY(-2px)}
.gcard .glyph{font-size:44px; line-height:1.1}
.gcard b{font-family:var(--head-font); font-size:17px}
.gcard span{font-size:13px; color:var(--muted)}
.gcard .tag{font-size:10px; color:var(--on-shu)}
.guide{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.guide .prose p{margin:0 0 10px; color:var(--ink-2)}
.ex{display:grid; grid-template-columns:auto 1fr auto; gap:6px 14px; align-items:center}
.ex .kana{font-size:26px}
.ex .r{font-weight:700}
.ex .m{color:var(--muted); font-size:13px}
.ex-row{display:contents}
.quiz .q{font-size:56px; text-align:center; margin:8px 0}

/* ---------- settings ---------- */
.settings{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
.row{display:flex; justify-content:space-between; align-items:center; gap:18px; padding:14px 0; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t b{display:block}
.row .t span{color:var(--muted); font-size:13px}
input[type=range]{accent-color:var(--shu); width:180px}
.rangewrap{display:flex; align-items:center; gap:12px; font-weight:700; font-variant-numeric:tabular-nums}
.btns{display:flex; gap:10px; flex-wrap:wrap}
.btn.danger{color:var(--shu); border-color:color-mix(in srgb,var(--shu) 40%,transparent)}
.prose p{margin:0 0 10px; color:var(--ink-2)}
.codebox{width:100%; min-height:90px; font-family:ui-monospace,monospace; font-size:12px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--ink); padding:10px; margin-top:10px; word-break:break-all}
.steps{margin:6px 0 0; padding-left:20px; color:var(--ink-2)}
.toast{position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-weight:500; z-index:50; animation:fade .3s; max-width:90vw; text-align:center}

@media (max-width:860px){
  .hero,.two,.charts,.three{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .practice{grid-template-columns:1fr}
  .lesson{grid-template-columns:1fr auto}
  .lesson .chips{grid-column:1/-1; grid-row:2}
}
@media (max-width:640px){
  /* a backdrop-filter on the header would trap the fixed bottom nav inside it */
  header{backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--paper)}
  #themeBtn{margin-left:auto}
  nav{position:fixed; bottom:0; left:0; right:0; margin:0; z-index:20; justify-content:space-around; gap:0;
    background:color-mix(in srgb,var(--paper-2) 92%,transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; padding:6px 2px; border-radius:12px}
  nav button svg{display:block}
  nav button.on{background:none; color:var(--shu); font-weight:700}
  nav button:hover{background:none}
  main{padding-bottom:110px}
  body.focus nav{display:none}
  body.focus main{padding-bottom:40px}
}
@media (max-width:520px){
  .logo small{display:none}
  .hero-main{padding:24px}
  .face{min-height:380px; padding:20px}
  .rate{gap:6px}
  .rate .j{display:none}
  .done .grid{grid-template-columns:repeat(2,1fr)}
  .row{flex-direction:column; align-items:flex-start}
  .keys{display:none}
  .kv{grid-template-columns:repeat(2,1fr)}
  .compare .kana{font-size:64px}
}
/* =========================================================
   Visual refresh: shared building blocks used across pages
   ========================================================= */
main{max-width:1140px}
.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--paper-2) 97%,var(--ink) 3%),var(--paper-2) 40%); box-shadow:var(--shadow), inset 0 1px 0 color-mix(in srgb,#fff 6%,transparent)}
.panel h2{font-size:18px; letter-spacing:.01em}
.sec-h{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.sec-h h2{margin:0}
.sec-h .muted{font-size:12.5px}
.page-head{margin-bottom:24px}
.page-head h1{font-size:34px; line-height:1.1; font-weight:800}
.page-head .sub{max-width:62ch}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--shu) 88%,#fff 12%),var(--shu))}
.btn:focus-visible, .linkbtn:focus-visible, .chip:focus-visible, .seg button:focus-visible, nav button:focus-visible{outline:2px solid var(--ai); outline-offset:2px}
.meter{display:flex; height:8px; border-radius:999px; background:var(--paper-3); overflow:hidden; gap:2px}
.meter.sm{height:5px}
.meter span{display:block; height:100%; border-radius:999px; transition:width .6s cubic-bezier(.2,.8,.2,1)}
.muted.small, small.muted{font-size:12px}
.legend{gap:12px; font-size:11.5px}

/* Home */
.home-head{margin:6px 0 22px}
.home-head h1{font-family:var(--head-font); font-size:clamp(28px,4vw,40px); line-height:1.12; margin:0 0 6px; font-weight:800}
.home-head .sub{color:var(--ink-2); margin:0; font-size:15.5px}
.home-grid{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:22px; align-items:start}
.home-main, .home-side{display:flex; flex-direction:column; gap:22px; min-width:0}
.home-side{position:sticky; top:84px}
.today-card{padding:22px 22px 10px}
.tasks{display:flex; flex-direction:column}
.task{display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center; padding:14px 0; border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task-ico{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-size:21px; font-weight:800; background:var(--shu-2); color:var(--shu)}
.task-t{display:flex; flex-direction:column; min-width:0}
.task-t b{font-size:16px}
.task-t span{color:var(--muted); font-size:13px}
.task.is-done .task-ico{background:var(--matcha-2); color:var(--matcha)}
.task.is-done .task-t b{color:var(--ink-2)}
.task-ok{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--matcha-2); color:var(--matcha); font-weight:800}
.practice{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:0}
.ptile{display:flex; flex-direction:row; align-items:center; gap:14px; position:static; overflow:visible; text-align:left; padding:16px; border-radius:var(--radius-panel); border:1px solid var(--line); background:var(--paper-2); color:var(--ink); box-shadow:var(--shadow); transition:transform .15s, border-color .2s}
.ptile:hover:not(:disabled){transform:translateY(-2px); border-color:color-mix(in srgb,var(--shu) 45%,var(--line))}
.ptile:disabled{opacity:.55}
.ptile.wide{grid-column:1/-1; border-color:color-mix(in srgb,var(--ai) 35%,var(--line)); background:linear-gradient(120deg,var(--paper-2) 55%,color-mix(in srgb,var(--ai) 9%,var(--paper-2)))}
.ptile.wide .pt-ico{background:color-mix(in srgb,var(--ai) 16%,transparent); color:var(--ai)}
.ptile .pt-go{margin-left:auto; font-weight:700; color:var(--ai); white-space:nowrap}
.pscopes{display:flex; flex-direction:column; align-items:center; gap:8px; margin:-6px 0 18px}
.pscopes .muted{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em}
.pscopes small{color:var(--muted); font-weight:500}
.pt-ico{flex:none; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:22px; font-weight:800; background:var(--paper-3); color:var(--ink-2)}
.pt-t{display:flex; flex-direction:column; min-width:0}
.pt-t b{font-size:15px}
.pt-t span{font-size:12.5px; color:var(--muted)}
.streak-card{padding:20px}
.streak-n{display:flex; align-items:center; gap:12px}
.streak-n b{font-family:var(--head-font); font-size:46px; line-height:1; color:var(--gold); font-variant-numeric:tabular-nums}
.streak-n span{display:flex; flex-direction:column; font-weight:700}
.streak-n small{font-weight:500; color:var(--muted); font-size:12px}
.week{display:flex; justify-content:space-between; margin:16px 0 14px}
.wd{display:flex; flex-direction:column; align-items:center; gap:5px}
.wd i{width:22px; height:22px; border-radius:50%; background:var(--paper-3); border:1px solid var(--line)}
.wd i.on{background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.wd i.is-today{outline:2px dashed color-mix(in srgb,var(--ink-2) 50%,transparent); outline-offset:2px}
.wd small{font-size:10.5px; color:var(--muted)}
.today-meter{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--line); padding-top:12px}
.today-meter span{display:flex; flex-direction:column; font-size:11.5px; color:var(--muted)}
.today-meter b{font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums}
.side-card{padding:18px 20px}
.progs{display:flex; flex-direction:column; gap:12px}
.prog-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; font-size:13.5px}
.prog-h span{font-weight:700; font-variant-numeric:tabular-nums}
.prog-h small{color:var(--muted); font-weight:500}
.home-side .forecast{height:92px; padding-top:0; gap:6px}
.home-side .fc .b{max-width:26px}
.kotd-row{display:flex; align-items:center; gap:16px}
.kotd-row .big{font-size:64px; line-height:1}
.kotd-row .rom{font-size:20px}
.kotd-row .word{font-size:13px; color:var(--ink-2)}
.kotd-row .word .kana{font-size:16px}
.course .sub{margin-top:-4px}
.script{border:1px solid var(--line); border-radius:16px; margin-top:12px; background:var(--paper); overflow:hidden}
.script summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto 120px auto; gap:14px; align-items:center; padding:14px 16px}
.script summary::-webkit-details-marker{display:none}
.script .sname{font-size:20px; font-weight:800}
.sinfo{display:flex; flex-direction:column}
.sinfo small{color:var(--muted); font-size:12px}
.scount{font-weight:800; font-variant-numeric:tabular-nums}
.scount small{color:var(--muted); font-weight:500}
.chev{font-size:22px; color:var(--muted); transition:transform .2s; line-height:1}
.script[open] .chev{transform:rotate(90deg)}
.lessons{padding:0 16px 6px}
.lesson{grid-template-columns:200px 1fr auto}
.lesson-h{display:flex; flex-direction:column; gap:5px}
.lesson-h .meter{max-width:150px}
@media (max-width:1000px){
  .home-grid{grid-template-columns:1fr}
  .home-side{position:static; display:grid; grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .home-side{grid-template-columns:1fr}
  .practice{grid-template-columns:1fr}
  .task{grid-template-columns:40px 1fr; row-gap:10px}
  .task > .btn, .task > .task-ok{grid-column:2; justify-self:start}
  .task-ico{width:40px; height:40px}
  .script summary{grid-template-columns:auto 1fr auto auto}
  .script summary .meter{display:none}
  .lesson{grid-template-columns:1fr auto}
}

/* Vocabulary */
.vhead{align-items:flex-end}
.vhead-act{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.vhead-act .muted{font-size:12px}
.vsum{display:grid; grid-template-columns:auto 1fr auto; gap:10px 26px; align-items:center; padding:18px 22px; margin-bottom:22px}
.vsum-n{display:flex; gap:22px}
.vk{display:flex; flex-direction:column; background:none; border:0}
.vk b{font-size:24px; font-variant-numeric:tabular-nums; line-height:1.1; color:var(--ink)}
.vk span{font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em}
.vk.s-learn b{color:var(--shu)} .vk.s-young b{color:var(--gold)} .vk.s-master b{color:var(--matcha)}
.vmeter{height:10px}
.m-learn{background:var(--shu)} .m-young{background:var(--gold)} .m-master{background:var(--matcha)}
.vsum-f{font-weight:700; font-size:13px; white-space:nowrap}
main .vgrid{grid-template-columns:minmax(0,1fr) 340px; align-items:start}
.vside{display:flex; flex-direction:column; gap:22px; min-width:0; position:sticky; top:84px}
.vtabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:0 0 4px}
.vtabs button{background:none; border:0; border-bottom:2px solid transparent; padding:8px 10px; margin-bottom:-1px; color:var(--ink-2); font-weight:600; font-size:13.5px}
.vtabs button small{color:var(--muted); font-weight:500; margin-left:2px}
.vtabs button.on{color:var(--ink); border-bottom-color:var(--shu)}
.vwords .vlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-top:12px}
.vwords .vitem{position:relative; grid-template-columns:auto 1fr auto; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:12px; background:var(--paper)}
.vwords .vitem:first-child{border-top:1px solid var(--line)}
.vwords .vitem:hover{border-color:color-mix(in srgb,var(--ai) 40%,var(--line))}
.vwords .vitem.editing{grid-column:1/-1}
.vwords .vjp .kana{font-size:20px}
.vwords .vtxt b{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vwords .vstate{position:absolute; top:7px; left:7px; width:7px; height:7px; border-radius:50%; padding:0; background:var(--paper-3); border:0}
.vwords .vstate.s-learn{background:var(--shu)} .vwords .vstate.s-young{background:var(--gold)} .vwords .vstate.s-master{background:var(--matcha)}
.vwords .vact{gap:0}
.vwords .vact .icon-btn{width:26px; height:26px}
.vwords .vmore{grid-column:1/-1; justify-self:center; margin-top:6px}
.vwords .vlist .empty{grid-column:1/-1}
.vmine{font-style:normal; color:var(--ai)}
.vwords .vact .icon-btn{opacity:.55} .vitem:hover .vact .icon-btn{opacity:1}
.vunlock{display:flex; gap:12px; align-items:flex-start; font-size:13.5px}
.vunlock .muted{font-size:12.5px; margin-top:3px}
.vunlock .kana{font-size:16px; color:var(--ink)}
.vu-ico{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--matcha-2); color:var(--matcha); font-weight:800; font-size:18px}
@media (max-width:1000px){ main .vgrid{grid-template-columns:1fr} .vside{position:static} }
@media (max-width:640px){
  .vhead-act{align-items:stretch; width:100%}
  .vsum{grid-template-columns:1fr}
  .vsum-n{gap:0; justify-content:space-between}
  .vk b{font-size:20px}
  .vwords .vact .icon-btn{opacity:1}
}

/* Kanji */
.kj-head{display:flex; align-items:center; gap:22px; justify-content:center; margin:6px 0 4px}
.kj-big{font-size:110px; line-height:1}
.kj-reads{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.kj-reads > div{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.kj-reads .lbl{font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); min-width:28px}
.kj-reads b{font-size:20px; font-weight:500}
.kj-reads small{color:var(--muted); font-size:12.5px}
.kw-read{font-size:22px; color:var(--ink-2); margin-top:2px}
.linkish{background:none; border:0; padding:0; color:var(--ink); cursor:pointer; font-size:20px}
.kjgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px}
.kjles .grid5{gap:6px}
.kjcell .kana{font-size:clamp(24px,4vw,32px)}
.kjcell .r{font-size:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 3px}
.kwlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px}
.kwitem{position:relative; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:baseline; text-align:left; padding:9px 12px; border:1px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink)}
.kwitem b{font-size:20px; font-weight:500; grid-row:span 2}
.kwitem .kana{font-size:14px; color:var(--ink-2)}
.kwitem small{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kwitem .vstate{position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--paper-3)}
.kwitem .vstate.s-learn{background:var(--shu)} .kwitem .vstate.s-young{background:var(--gold)} .kwitem .vstate.s-master{background:var(--matcha)}
@media (max-width:640px){ .kj-big{font-size:84px} .kj-head{gap:14px} .kjgrid{grid-template-columns:1fr} }

/* Grammar */
.gwrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
.gexplain h1{font-size:36px; margin:2px 0 0}
.gexplain p{line-height:1.6}
.gexplain h3{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px}
.gpattern{font-size:22px; padding:12px 16px; border-radius:12px; background:color-mix(in srgb,var(--ai) 10%,var(--paper)); border:1px solid color-mix(in srgb,var(--ai) 30%,var(--line)); margin:12px 0 14px; text-align:center}
.gex{display:flex; flex-direction:column; gap:10px}
.gex > div{display:flex; flex-direction:column; padding:10px 14px; border-radius:12px; background:var(--paper); border:1px solid var(--line)}
.gex .kana{font-size:20px}
.gex small{color:var(--muted)}
.gface{min-height:auto; padding-bottom:26px}
.gsent{font-size:clamp(20px,4.5vw,28px); text-align:center; margin:26px 0 8px; line-height:1.6}
.gap{display:inline-block; min-width:2.6em; border-bottom:3px solid var(--ai); margin:0 4px; color:var(--ai); font-weight:700}
.gap.filled{border-color:var(--matcha); color:var(--matcha)}
.gopts .opt{font-size:20px}
.gen{text-align:center; color:var(--ink-2); margin:22px 0 10px}
.gline{min-height:58px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; padding:10px; border-radius:14px; border:2px dashed var(--line); margin:0 0 14px}
.gline.ok{border-style:solid; border-color:var(--matcha)} .gline.no{border-style:solid; border-color:var(--shu)}
.gbank{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:44px}
.tile{font-size:19px; padding:8px 14px; border-radius:12px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); box-shadow:0 2px 0 var(--line)}
.tile:active{transform:translateY(1px)}
.gfix{text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center}
.gfix.good b{color:var(--matcha)} .gfix:not(.good) b{color:var(--shu)}
.panel.fix.gfix .gans{font-size:22px; line-height:1.5; font-weight:500}
.gpath{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
.gitem{display:grid; grid-template-columns:36px 1fr auto; gap:12px; align-items:center; text-align:left; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.gitem:disabled{opacity:.5}
.gitem.locked{cursor:pointer}
.gitem.next{border-color:color-mix(in srgb,var(--ai) 50%,var(--line)); box-shadow:0 0 0 3px color-mix(in srgb,var(--ai) 12%,transparent)}
.gnum{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:var(--paper-3); color:var(--ink-2)}
.gitem.done .gnum{background:var(--matcha-2); color:var(--matcha)}
.gitem.next .gnum{background:color-mix(in srgb,var(--ai) 16%,transparent); color:var(--ai)}
.gtxt{display:flex; flex-direction:column; min-width:0}
.gtxt b{font-size:16px; font-weight:600}
.gtxt small{color:var(--muted); font-size:12.5px}
.gmeta small{color:var(--muted); font-weight:700}
.gmeta .go{color:var(--ai)}
.gchips{display:inline-flex; flex-wrap:wrap; gap:6px; margin-left:4px}
.gchip{display:inline-flex; align-items:center; gap:5px; font-family:var(--ui-font); font-size:12px; font-weight:600; padding:2px 9px 2px 3px; border-radius:999px; border:1px solid color-mix(in srgb,var(--ai) 40%,var(--line)); background:color-mix(in srgb,var(--ai) 8%,var(--paper)); color:var(--ink)}
.gchip span{width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:var(--ai); color:#fff; font-size:10px}
.gsheet .gexplain{box-shadow:none; border:0; padding:4px 0 0; background:none}
.opt.mean{font-family:var(--ui-font); font-size:16px; letter-spacing:0}
.lvl-h{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); font-weight:600; margin:6px 0 12px}
.lvl-h span{font-size:13px; font-weight:800; color:var(--paper); background:var(--ink); padding:3px 9px; border-radius:8px; letter-spacing:.04em}
.kjgrid + .lvl-h, .rgrid + .lvl-h{margin-top:26px}
.task-more{width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 0 12px 58px; color:var(--ai); font-weight:700}
.task-donerow{display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); padding:12px 0; color:var(--muted); font-size:13px}
.task-donerow .task-ok{width:26px; height:26px; margin-left:9px; font-size:13px}
.pathg{display:flex; align-items:center; gap:22px; padding:14px 20px; margin-bottom:22px; flex-wrap:wrap}
.pg-steps{display:flex; gap:6px}
.pg-step{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:58px}
.pg-step i{position:relative; width:100%; height:6px; border-radius:999px; background:var(--paper-3); overflow:hidden}
.pg-step i::after{content:""; position:absolute; inset:0 auto 0 0; width:var(--p); background:var(--ai); border-radius:999px}
.pg-step.is-done i::after{background:var(--matcha)}
.pg-step span{font-size:11.5px; color:var(--muted); font-weight:600; white-space:nowrap}
.pg-step.cur span{color:var(--ink); font-weight:800}
.pg-now{display:flex; flex-direction:column; min-width:0; flex:1}
.pg-now b{font-size:14.5px}
.pg-now .muted{font-size:12.5px}
nav button[hidden]{display:none !important}
.gitem:not(.done):not(.next){opacity:.72}
@media (max-width:640px){ .pathg{gap:10px; padding:12px 14px} .pg-steps{width:100%} .pg-step{flex:1; min-width:0} .pg-step span{font-size:10px} }
.preview-banner{display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.preview-banner > div{flex:1; display:flex; flex-direction:column; gap:6px}
.preview-banner .muted{font-size:13px}
.pv-tag{flex:none; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:8px; background:var(--gold-2); color:var(--gold)}
nav button.pv span::after{content:"·"; margin-left:3px; color:var(--gold); font-weight:900}
.mk-note{max-width:440px; margin:8px auto 0; padding:9px 13px; border-radius:12px; font-size:13px; line-height:1.45; text-align:left; animation:cardIn .25s}
.mk-note.know{background:var(--shu-2); color:var(--ink); border:1px solid color-mix(in srgb,var(--shu) 35%,transparent)}
.mk-note.typo{background:var(--gold-2); color:var(--ink); border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.cb-mks + .mk-note{margin-left:0}
.mk-b{transition:transform .12s}
.mk-b:active{transform:scale(.94)}
/* Flashcards */
.flash .study-top{grid-template-columns:auto 1fr auto}
.fc-stats{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; font-size:13px; font-weight:700; color:var(--ink-2)}
.fc-stats span:first-child{color:var(--muted); font-weight:600}
.fc-streak{color:var(--gold)}
.fc-card{cursor:pointer; min-height:340px; display:flex; flex-direction:column}
.fc-card.open{cursor:default}
.fc-jp{flex:1; display:grid; place-items:center; font-size:clamp(90px,26vw,150px); line-height:1.1; padding:10px 0; text-align:center}
.fc-jp.long{font-size:clamp(48px,11vw,80px)}
.fc-card.open .fc-jp{flex:none; font-size:clamp(60px,14vw,96px)}
.fc-card.open .fc-jp.long{font-size:clamp(40px,9vw,64px)}
.fc-q{flex:1; display:grid; place-content:center; text-align:center; gap:6px}
.fc-a{text-align:center; margin:8px 0 6px}
.fc-main{font-size:clamp(26px,6vw,38px); font-weight:800; line-height:1.2}
.fc-main.kana{font-weight:500}
.fc-sub{color:var(--muted); font-size:15px; text-align:center; margin-top:4px}
.fc-aid{margin-top:12px; padding:10px 14px; border-radius:12px; background:var(--paper); border:1px solid var(--line); font-size:13.5px; color:var(--ink-2)}
.fc-btns{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:520px; margin:18px auto 0}
.fc-btns .btn{display:flex; flex-direction:column; gap:2px; padding:14px}
.fc-btns small{font-size:10.5px; opacity:.6; font-weight:600}
.fc-no{border-color:color-mix(in srgb,var(--shu) 45%,var(--line)); color:var(--shu)}
.ptile.off{opacity:.55}
.pt-acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.vhead-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end}
@media (max-width:640px){ .pt-acts{width:100%; margin-left:0} .pt-acts .btn{flex:1} .ptile.wide{flex-wrap:wrap} .vhead-btns{justify-content:stretch} .vhead-btns .btn{flex:1} .flash .study-top .btn{padding:6px 8px; font-size:12px} }
.mastery{display:flex; flex-direction:column; gap:6px; margin:0 0 12px; padding:10px 12px; border-radius:12px; background:var(--paper); border:1px solid var(--line); font-size:12.5px; color:var(--ink-2)}
.tipsheet h2{margin:4px 0 8px}
.tipsheet p{line-height:1.55; color:var(--ink-2)}
.tips{padding-left:20px; display:flex; flex-direction:column; gap:10px; line-height:1.5; color:var(--ink-2)}
.tips b{color:var(--ink)}
.chart-tip{font-size:13px; margin:-10px 0 14px}
@media (max-width:980px){ .logo small{display:none} }
.rline .say{display:inline-grid; vertical-align:middle; margin:0 8px 0 0; width:30px; height:30px; line-height:1}
.rline .say svg{width:15px; height:15px}
.gex .say{margin-right:6px; vertical-align:middle}
.gloss .say{align-self:center}
.fc-say{display:flex; justify-content:center; margin-top:8px}
/* Reader */
.rwrap{max-width:820px; margin:0 auto}
.furi{display:flex; align-items:center; gap:8px}
.furi .muted{font-size:12px; font-weight:700; white-space:nowrap}
.furi .seg{flex-wrap:nowrap}
.furi .seg button{padding:5px 11px; font-size:12.5px}
.rtext{padding:26px 28px; line-height:2.5}
.rline{margin:0 0 6px; font-size:clamp(20px,3.6vw,26px)}
.spk{display:inline-block; font-size:.62em; font-weight:700; color:var(--ai); background:color-mix(in srgb,var(--ai) 12%,transparent); border-radius:8px; padding:0 8px; margin-right:8px; vertical-align:middle; line-height:1.7}
.kana-icon2{font-size:.62em !important; letter-spacing:-.04em}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.rtools{display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.rtext.joined .tok{margin:0; padding:0}
.tok{background:none; border:0; padding:0 1px; margin:0 2px; border-radius:6px; color:var(--ink); font:inherit; cursor:pointer; line-height:1.4}
.tok:hover{background:color-mix(in srgb,var(--ai) 10%,transparent)}
.tok.on{background:color-mix(in srgb,var(--ai) 20%,transparent); box-shadow:0 2px 0 var(--ai)}
.tok rt{font-size:.45em; color:var(--muted)}
.punct{margin-right:4px}
/* A word and the punctuation around it wrap as one, so a line never starts with 。、！？ or a closing bracket */
.tw{white-space:nowrap}
.gloss{position:sticky; bottom:14px; z-index:5; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin:14px 0; padding:14px 18px; border-radius:16px; background:var(--paper-2); border:1px solid var(--line); box-shadow:var(--shadow)}
.gloss b{font-size:24px; font-weight:600}
.gloss .gm{font-weight:700}
.gloss .btn{margin-left:auto}
.rquiz{margin-top:18px}
.rquiz .opt{font-family:var(--ui-font); font-size:15px; font-weight:600; letter-spacing:0; padding:14px 12px}
.rgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
.rcard{display:flex; flex-direction:column; gap:4px; text-align:left; color:var(--ink); padding:18px; cursor:pointer}
.rcard.locked{opacity:.55}
.rcard.read{border-color:color-mix(in srgb,var(--matcha) 45%,var(--line))}
.rc-t{font-size:22px; font-weight:600}
.rc-t rt{font-size:.45em; color:var(--muted)}
.rc-en{color:var(--ink-2)}
.rc-m{font-size:12px; color:var(--muted); font-weight:700; margin-top:6px}
.rcard.read .rc-m{color:var(--matcha)}
.ktabs{margin-bottom:10px; border-bottom:0}
.kpis2{grid-template-columns:repeat(3,1fr)}
nav button{padding:8px 11px}
@media (max-width:1100px){ nav button{padding:7px 8px; font-size:13.5px} }
/* Tablets in portrait (iPad mini, iPad): nine tabs only just fit beside the logo. The logo keeps its stamp,
   and if the tabs still don't fit they scroll sideways on their own instead of widening the whole page. */
@media (min-width:641px) and (max-width:900px){
  .logo b{display:none}
  nav{min-width:0; overflow-x:auto; scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:7px 5px; flex:none}
}
@media (max-width:640px){
  .rtext{padding:18px 16px}
  .gloss{bottom:84px}
  nav button[data-view="settings"]{display:none}
  nav button{font-size:10px; padding:6px 0}
  .kpis2{grid-template-columns:1fr}
}

/* Stats */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
.kpi{display:flex; gap:14px; align-items:flex-start; padding:18px}
.kpi-ico{flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:19px; background:var(--shu-2); color:var(--shu)}
.kpi:nth-child(2) .kpi-ico{background:var(--gold-2); color:var(--gold)}
.kpi:nth-child(3) .kpi-ico{background:color-mix(in srgb,var(--ai) 15%,transparent); color:var(--ai)}
.kpi:nth-child(4) .kpi-ico{background:var(--matcha-2); color:var(--matcha)}
.kpi .k{font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.kpi .v{font-size:28px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; margin-top:2px}
.kpi .v small{font-size:14px; color:var(--muted); font-weight:500}
.kpi .f{font-size:12px; color:var(--muted); margin-top:2px}
.cal{margin-bottom:22px}
.cal-body{display:grid; grid-template-columns:minmax(0,640px) 1fr; gap:28px; align-items:center}
.cal-body > div{min-width:0}
.cal .heat{grid-template-columns:repeat(26,minmax(0,1fr))}
.cal .heat-wrap{grid-template-columns:auto minmax(0,1fr)}
.cal-side{display:grid; grid-template-columns:1fr 1fr; gap:16px 12px; border-left:1px solid var(--line); padding-left:24px}
.cal-side .vk b small{font-size:13px; color:var(--muted); font-weight:500}
@media (max-width:900px){ .cal-body{grid-template-columns:minmax(0,1fr)} .cal-side{border-left:0; padding-left:0; grid-template-columns:repeat(4,1fr)} }
@media (max-width:640px){ .cal-side{grid-template-columns:1fr 1fr} }
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start; margin-bottom:22px}
.stats-grid > .panel, .stats-full > .panel{margin:0 !important; height:100%}
.three{margin-top:22px}
/* Chart */
.chart-sum{display:flex; align-items:center; gap:30px; flex-wrap:wrap; padding:16px 22px; margin-bottom:22px}
.chart-sum .vk b small{font-size:14px; color:var(--muted); font-weight:500}
.chart-sum .legend{margin-left:auto}
.csec{display:flex; flex-direction:column; align-items:flex-end; gap:5px; font-size:12px; color:var(--muted); min-width:150px}
.csec b{color:var(--ink)}
.csec .meter{width:150px}
.cell{position:relative; overflow:hidden}
.cell .cbar{position:absolute; left:8px; right:8px; bottom:6px; height:3px; border-radius:2px; background:color-mix(in srgb,currentColor 18%,transparent)}
.cell .cbar i{display:block; height:100%; border-radius:2px; background:currentColor}
.cell.leech::after{content:""; position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--shu); box-shadow:0 0 0 2px var(--paper-2)}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,1fr)} .stats-grid{grid-template-columns:1fr} }
@media (max-width:640px){
  .kpi{padding:14px; gap:10px} .kpi-ico{width:34px; height:34px; font-size:16px} .kpi .v{font-size:22px}
  .chart-sum{gap:18px} .chart-sum .legend{margin-left:0}
  .csec{align-items:flex-start}
}

/* Settings */
.set-layout{display:grid; grid-template-columns:200px minmax(0,1fr); gap:28px; align-items:start; max-width:980px}
.set-nav{position:sticky; top:84px; display:flex; flex-direction:column; gap:2px}
.set-nav button{display:flex; align-items:center; gap:10px; background:none; border:0; padding:9px 12px; border-radius:10px; color:var(--ink-2); font-weight:600; text-align:left}
.set-nav button:hover{background:var(--paper-3); color:var(--ink)}
.set-nav button span{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:var(--paper-3); font-size:13px; font-weight:800; color:var(--ink-2)}
.set-layout .settings{max-width:none; margin:0; gap:22px}
.set-layout .settings > .panel{scroll-margin-top:84px; padding:22px 24px}
.set-layout .settings > .panel > h2:first-child{margin-bottom:6px}
.set-layout .row .t{max-width:46ch}
.set-layout .row:first-of-type{border-top:0}
@media (max-width:860px){
  .set-layout{grid-template-columns:minmax(0,1fr); gap:16px}
  .set-nav{position:static; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px; scrollbar-width:none}
  .set-nav button{flex:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 6px; background:var(--paper-2)}
  .set-nav button span{width:22px; height:22px; border-radius:50%; font-size:11px}
}

/* Copybook header: title and answer-mode switch on a fixed first row */
.cb-head{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"title switch" "sub opt"; gap:10px 24px; align-items:end; margin-bottom:24px}
.cb-title{grid-area:title}
.cb-title h1{font-size:34px; line-height:1.1; font-weight:800; margin:0}
.cb-switch{grid-area:switch; flex-wrap:nowrap; box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.cb-switch button{white-space:nowrap; padding:8px 16px}
.cb-sub{grid-area:sub; margin:0; min-height:2.9em; max-width:62ch}
.cb-opt{grid-area:opt; justify-self:end; align-self:start; font-size:12.5px}
.seg.sm2 button{padding:5px 12px; font-size:12.5px}
.paper{box-shadow:0 1px 0 rgba(0,0,0,.04), 0 14px 34px -14px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.08)}
@media (max-width:760px){
  .cb-head{grid-template-columns:1fr; grid-template-areas:"title" "switch" "sub" "opt"}
  .cb-switch{display:flex; width:100%}
  .cb-switch{flex-wrap:wrap; border-radius:16px}
  .cb-switch button{flex:1 1 30%; padding:7px 6px; font-size:12px; white-space:normal; line-height:1.2}
  .cb-opt{justify-self:start}
  .cb-sub{min-height:0}
}

/* =========================================================
   Extra themes (each sets the app palette and its copybook paper)
   ========================================================= */
/* Violet — charcoal grey with purple accents */
:root[data-theme="violet"]{
  --paper:#1f2024; --paper-2:#2a2b31; --paper-3:#34353d; --ink:#ececf1; --ink-2:#c6c6d2; --muted:#9e9eab; --line:#3e3f49;
  --shu:#a78bfa; --shu-2:#352c4f; --on-shu:#1b1530; --gold:#e3b75e; --gold-2:#3a3222; --matcha:#7dd3a8; --matcha-2:#1e3a2e;
  --ai:#93a4ff; --ai-2:#272c49; --sakura:#c4b5fd; --wave:#2a2b31;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.35); color-scheme:dark;
  --pp-bg:#2a2b31; --pp-ink:#ececf1; --pp-faint:#9191a0; --pp-num:#6f6f7d; --pp-line:#3e3f49; --pp-note:#b6b6c4; --pp-bad:#7d7d8a;
  --pp-rule:#5d5189; --pp-dash:#3d3954; --pp-margin:#7c5cc4; --pp-pen:#c4b5fd; --pp-red:#ff8fa3;
  --pp-dot:rgba(255,255,255,.02); --pp-hl:rgba(167,139,250,.12); --pp-sheet:#25262b; --pp-sheet2:#222327;
}
:root[data-theme="violet"] .hero-main{background:linear-gradient(140deg,var(--paper-2) 55%,color-mix(in srgb,var(--shu) 14%,var(--paper-2)))}

/* Code — a code editor for developers: monospace, syntax colours, comments, a cursor and a status bar */
:root[data-theme="code"]{
  --paper:#1e1e1e; --paper-2:#252526; --paper-3:#2d2d30; --ink:#d4d4d4; --ink-2:#b8b8b8; --muted:#77a264; --line:#3c3c3c;
  --shu:#3794ff; --shu-2:#1b3047; --on-shu:#ffffff; --gold:#dcdcaa; --gold-2:#33331f; --matcha:#4ec9b0; --matcha-2:#173a35;
  --ai:#c586c0; --ai-2:#3a2639; --sakura:#ce9178; --wave:#2b2b2b;
  --shadow:0 0 0 1px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  --ui-font:'JetBrains Mono',ui-monospace,monospace; --head-font:'JetBrains Mono',ui-monospace,monospace;
  --radius-panel:6px; --radius-card:8px; --radius-btn:4px;
  --pp-bg:#1e1e1e; --pp-ink:#ce9178; --pp-faint:#6a9955; --pp-num:#858585; --pp-line:#2d2d2d; --pp-note:#6a9955; --pp-bad:#808080;
  --pp-rule:#3c3c3c; --pp-dash:#2a2a2a; --pp-margin:#404040; --pp-pen:#9cdcfe; --pp-red:#f14c4c;
  --pp-dot:transparent; --pp-hl:rgba(255,255,255,.05); --pp-sheet:#1a1a1a; --pp-sheet2:#171717;
}
:root[data-theme="code"] .eyebrow::before{content:'// '}
:root[data-theme="code"] .eyebrow{color:var(--muted)}
:root[data-theme="code"] .page-head h1::after,
:root[data-theme="code"] .hero h1::after{content:'▍'; color:var(--shu); margin-left:4px; animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
:root[data-theme="code"] .hero h1 em{color:var(--sakura)}
:root[data-theme="code"] .hero h1 em::before,
:root[data-theme="code"] .hero h1 em::after{content:'"'}
:root[data-theme="code"] .panel h2::before{content:'# '; color:var(--ai)}
:root[data-theme="code"] .btn.primary::before{content:'▶ '; font-size:.8em}
:root[data-theme="code"] .cb-note span:not(.cb-tip)::before{content:'// '}
:root[data-theme="code"] .paper{border-radius:6px}
:root[data-theme="code"] .hole{display:none}
:root[data-theme="code"] .hanko{border-radius:4px; transform:none}
:root[data-theme="code"] .pill{border-radius:3px}
:root[data-theme="code"] .pill::before{content:'<'} :root[data-theme="code"] .pill::after{content:' />'}
.statusbar{display:none}
:root[data-theme="code"] .statusbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:15; height:24px; padding:0 12px; gap:16px;
  align-items:center; justify-content:space-between; background:#007acc; color:#fff; font:12px/1 var(--ui-font); white-space:nowrap; overflow:hidden}
:root[data-theme="code"] .statusbar span{display:flex; gap:14px}
:root[data-theme="code"] main{padding-bottom:90px}

/* Sakura — soft cherry-blossom pink */
:root[data-theme="sakura"]{
  --paper:#fdf2f4; --paper-2:#fffafb; --paper-3:#f8e4ea; --ink:#3a2a30; --ink-2:#5e4750; --muted:#75626a; --line:#f0d5dc;
  --shu:#d6457a; --shu-2:#fbe0ea; --on-shu:#ffffff; --gold:#a8741a; --gold-2:#f8ecd3; --matcha:#4c8546; --matcha-2:#e3f0de;
  --ai:#7a5ab8; --ai-2:#ece5f7; --sakura:#f4a7bb; --wave:#f1d3db;
  --shadow:0 1px 2px rgba(120,40,70,.06),0 10px 34px rgba(160,60,100,.10); color-scheme:light;
  --pp-bg:#fff7f9; --pp-ink:#3a2a30; --pp-faint:#a58b93; --pp-num:#d0a6b3; --pp-line:#f2dde3; --pp-note:#7d6670; --pp-bad:#bba3ab;
  --pp-rule:#efb3c4; --pp-dash:#f6d6df; --pp-margin:#e8899f; --pp-pen:#7a3b8f; --pp-red:#d6335f;
  --pp-dot:rgba(214,69,122,.05); --pp-hl:rgba(255,200,215,.35); --pp-sheet:#f7e6eb; --pp-sheet2:#f2dee4;
}

/* Neon Tokyo — night city glow */
:root[data-theme="neon"]{
  --paper:#0d0b1a; --paper-2:#151229; --paper-3:#1e1a38; --ink:#ece8ff; --ink-2:#bdb6e6; --muted:#8881af; --line:#2e2854;
  --shu:#ff3d8b; --shu-2:#3a1030; --on-shu:#ffffff; --gold:#ffd23f; --gold-2:#3a3010; --matcha:#3ef0b0; --matcha-2:#0f3a2c;
  --ai:#3ee8ff; --ai-2:#0f2c3a; --sakura:#b388ff; --wave:#1d1838;
  --shadow:0 0 0 1px rgba(179,136,255,.10),0 12px 34px rgba(0,0,0,.55); color-scheme:dark;
  --pp-bg:#151229; --pp-ink:#ece8ff; --pp-faint:#857ead; --pp-num:#5a5388; --pp-line:#2e2854; --pp-note:#a9a1d8; --pp-bad:#6e6796;
  --pp-rule:#5b2a6e; --pp-dash:#2b2450; --pp-margin:#ff3d8b; --pp-pen:#3ee8ff; --pp-red:#ff5c9d;
  --pp-dot:transparent; --pp-hl:rgba(62,232,255,.07); --pp-sheet:#120f24; --pp-sheet2:#100d20;
}
:root[data-theme="neon"] body{background:radial-gradient(1200px 500px at 80% -10%,rgba(255,61,139,.16),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(62,232,255,.10),transparent 60%),var(--paper)}
:root[data-theme="neon"] .btn.primary{box-shadow:0 0 0 1px var(--shu),0 0 22px color-mix(in srgb,var(--shu) 60%,transparent)}
:root[data-theme="neon"] .hero h1,
:root[data-theme="neon"] .page-head h1{text-shadow:0 0 22px color-mix(in srgb,var(--ai) 45%,transparent)}
:root[data-theme="neon"] .hero h1 em{text-shadow:0 0 16px var(--shu)}
:root[data-theme="neon"] .panel,
:root[data-theme="neon"] .face{border-color:color-mix(in srgb,var(--sakura) 28%,transparent)}
:root[data-theme="neon"] .hanko{box-shadow:0 0 16px var(--shu)}
:root[data-theme="neon"] nav button.on{box-shadow:0 0 14px color-mix(in srgb,var(--ai) 50%,transparent)}

/* Retention checks */
.ret-banner{display:flex; align-items:center; gap:14px; margin-bottom:22px; border-color:color-mix(in srgb,var(--ai) 40%,transparent); background:linear-gradient(120deg,var(--paper-2) 60%,color-mix(in srgb,var(--ai) 10%,var(--paper-2)))}
.ret-banner .ret-ico{font-size:30px}
.ret-banner > div{flex:1; min-width:0}
.sync-hint .btns{flex:none; display:flex; gap:8px; align-items:center}
@media (max-width:640px){ .sync-hint{flex-wrap:wrap} .sync-hint .btns{width:100%} }
.ret-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.ret-tile{display:flex; flex-direction:column; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px}
.ret-tile .k{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.ret-tile .v{font-size:30px; font-weight:700; font-variant-numeric:tabular-nums}
.ret-tile .v small{font-size:14px; color:var(--muted)}
.ret-tile > span{font-size:12px}
